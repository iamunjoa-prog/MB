<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>앱 이용 지표 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f1efe8;--surface3:#e8e6df;
  --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);
  --text-primary:#1a1a18;--text-secondary:#5f5e5a;--text-hint:#888780;
  --accent:#1d9e75;--accent-light:#e1f5ee;--accent-dark:#0f6e56;
  --blue:#378add;--blue-light:#e6f1fb;
  --purple:#7f77dd;--purple-light:#eeedfe;
  --amber:#ba7517;--amber-light:#faeeda;
  --danger:#a32d2d;--danger-light:#fcebeb;
  --sidebar-w:200px;--header-h:52px;
  --radius:10px;--radius-sm:6px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1a;--surface:#2c2c2a;--surface2:#242422;--surface3:#1a1a18;
    --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
    --text-primary:#f1efe8;--text-secondary:#b4b2a9;--text-hint:#888780;
    --accent:#5dcaa5;--accent-light:#04342c;--accent-dark:#9fe1cb;
    --blue:#85b7eb;--blue-light:#042c53;
    --purple:#afa9ec;--purple-light:#26215c;
    --amber:#ef9f27;--amber-light:#412402;
    --danger:#f09595;--danger-light:#501313;
  }
}
body{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text-primary);font-size:14px;line-height:1.5;display:flex;flex-direction:column;min-height:100vh;}

/* TOP HEADER */
.top-header{height:var(--header-h);background:var(--surface);border-bottom:0.5px solid var(--border2);display:flex;align-items:center;padding:0 20px;gap:16px;position:fixed;top:0;left:0;right:0;z-index:200;}
.top-header-title{font-size:15px;font-weight:500;color:var(--text-primary);display:flex;align-items:center;gap:8px;white-space:nowrap;}
.top-header-title i{color:var(--accent);font-size:18px;}
.header-controls{display:flex;align-items:center;gap:10px;margin-left:auto;}
.tab-group{display:flex;background:var(--surface2);border-radius:var(--radius-sm);padding:3px;gap:2px;}
.tab-btn{padding:5px 16px;border-radius:4px;border:none;background:transparent;color:var(--text-secondary);font-size:12px;font-weight:500;cursor:pointer;transition:all 0.15s;}
.tab-btn.active{background:var(--surface);color:var(--text-primary);}
.date-nav{display:flex;align-items:center;gap:6px;}
.date-nav button{width:26px;height:26px;border:0.5px solid var(--border2);background:var(--surface);border-radius:var(--radius-sm);cursor:pointer;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font-size:13px;}
.date-nav button:hover{background:var(--surface2);}
.date-label{font-size:12px;font-weight:500;color:var(--text-primary);min-width:150px;text-align:center;white-space:nowrap;}

/* LAYOUT */
.layout{display:flex;margin-top:var(--header-h);min-height:calc(100vh - var(--header-h));}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:0.5px solid var(--border2);position:fixed;top:var(--header-h);bottom:0;left:0;overflow-y:auto;z-index:100;padding:16px 0;}
.sidebar-section{padding:0 12px;margin-bottom:4px;}
.sidebar-label{font-size:10px;font-weight:500;color:var(--text-hint);letter-spacing:0.07em;text-transform:uppercase;padding:8px 8px 4px;}
.menu-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-secondary);font-size:13px;font-weight:400;transition:all 0.12s;border:none;background:transparent;width:100%;text-align:left;}
.menu-item i{font-size:16px;flex-shrink:0;}
.menu-item:hover{background:var(--surface2);color:var(--text-primary);}
.menu-item.active{background:var(--accent-light);color:var(--accent);font-weight:500;}
.menu-item.active i{color:var(--accent);}

/* MAIN */
.main{margin-left:var(--sidebar-w);flex:1;padding:20px 24px;min-width:0;}

/* MINI KPI */
.mini-kpi-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.mini-kpi{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;min-width:140px;flex:1;}
.mini-kpi.accent{border-color:var(--accent);}
.mini-kpi-label{font-size:10px;color:var(--text-hint);font-weight:500;letter-spacing:0.04em;margin-bottom:4px;display:flex;align-items:center;gap:4px;}
.mini-kpi-value{font-size:18px;font-weight:500;color:var(--text-primary);line-height:1.1;}
.mini-kpi-sub{font-size:11px;color:var(--text-secondary);margin-top:2px;}
.mini-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:500;padding:1px 6px;border-radius:20px;margin-top:4px;}
.mini-badge.up{background:var(--accent-light);color:var(--accent);}
.mini-badge.down{background:var(--danger-light);color:var(--danger);}
.mini-badge.neutral{background:var(--surface2);color:var(--text-hint);}
.mini-kpi-mom{font-size:10px;color:var(--text-hint);margin-top:4px;display:flex;align-items:center;gap:3px;flex-wrap:wrap;}
.mini-kpi-mom i{font-size:11px;}
.mini-kpi-mom-delta{font-size:10px;font-weight:500;margin-left:3px;}
.mini-kpi-mom-delta.mom-up{color:var(--accent);}
.mini-kpi-mom-delta.mom-dn{color:var(--danger);}
.mini-kpi-mom-delta.mom-neu{color:var(--text-hint);}

/* 고객 행동 지표 섹션 헤더 */
.behavior-section-header{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--text-primary);padding:12px 16px;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;border-bottom:2px solid var(--accent);margin-bottom:0;}
.behavior-section-header i{font-size:16px;color:var(--accent);}
.behavior-section-desc{font-size:11px;font-weight:400;color:var(--text-hint);margin-left:4px;}
.page-section>.behavior-section-header+.table-section{margin-top:12px;}

/* 신규 섹션 색상 구분 (골드 계열) */
.tbl-wrap-x tbody tr.tbl-section-new td{background:rgba(240,192,64,0.06);}
.tbl-wrap-x tbody tr.tbl-section-new td.td-row{color:#8a6200;font-weight:600;background:rgba(240,192,64,0.12);border-right-color:rgba(186,117,23,0.3);}
.tbl-wrap-x tbody tr.tbl-section-new td.td-cur{background:rgba(240,192,64,0.18);}
.tbl-wrap-x tbody tr.tbl-section-new:hover td{background:rgba(240,192,64,0.14);}
.tbl-wrap-x tbody tr.tbl-section-new:hover td.td-row{background:rgba(240,192,64,0.22);}

/* KPI 카드 신규 컬러 */
.mini-kpi.kpi-new{border-color:rgba(186,117,23,0.5);background:rgba(240,192,64,0.05);}
.mini-kpi.kpi-new .mini-kpi-value{color:#8a6200;}

/* 표 섹션 범례 */
.tbl-section-legend{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:11px;color:var(--text-secondary);}
.tbl-legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--accent);}
.tbl-legend-dot.new{background:#ba7517;}
.chart-card-drilldown{cursor:pointer;transition:box-shadow 0.15s,border-color 0.15s;}
.chart-card-drilldown:hover{box-shadow:0 4px 16px rgba(29,158,117,0.15);border-color:var(--accent);}
.chart-card-drilldown:hover .chart-title{color:var(--accent);}
.drilldown-hint{font-size:10px;font-weight:400;color:var(--accent);opacity:0;transition:opacity 0.15s;margin-left:4px;}
.chart-card-drilldown:hover .drilldown-hint{opacity:1;}
/* T아이디 통합표 행 그룹 색상 */
.tid-group-header td{font-size:10px;font-weight:700;letter-spacing:.05em;padding:6px 12px;text-transform:uppercase;}
.tid-group-header-sub td{background:rgba(127,119,221,0.1);color:#6159bb;border-top:1.5px solid rgba(127,119,221,0.3);}
.tid-group-header-pair td{background:rgba(29,158,117,0.08);color:#0f6e56;border-top:1.5px solid rgba(29,158,117,0.25);}
.tid-row-sub td{background:rgba(127,119,221,0.03);}
.tid-row-sub td.td-cur{background:rgba(127,119,221,0.1) !important;}
.tid-row-pair td{background:rgba(29,158,117,0.03);}
.tid-row-pair td.td-cur{background:rgba(29,158,117,0.08) !important;}

/* T아이디 섹션 색상 구분 */
.table-section-tid-sub{border-left:3px solid #7f77dd;}
.tid-sub-title{color:#6159bb !important;}
.tid-sub-title i{color:#7f77dd !important;}
.tbl-wrap-tid-sub thead th.th-cur-tid-sub{background:rgba(127,119,221,0.2);color:#4a43a0;font-weight:600;}
.tbl-wrap-tid-sub tbody td.td-cur-tid-sub{background:rgba(127,119,221,0.07);font-weight:500;}
.table-section-tid-pair{border-left:3px solid #1d9e75;}
.tid-pair-title{color:#0f6e56 !important;}
.tid-pair-title i{color:#1d9e75 !important;}
.tbl-wrap-tid-pair thead th.th-cur-tid-pair{background:rgba(29,158,117,0.18);color:#0f6e56;font-weight:600;}
.tbl-wrap-tid-pair tbody td.td-cur-tid-pair{background:rgba(29,158,117,0.06);font-weight:500;}

.beh-guide{margin-top:14px;display:flex;flex-direction:column;gap:10px;border-top:0.5px solid var(--border);padding-top:12px;}
.beh-guide-item{display:flex;flex-direction:column;gap:3px;}
.beh-guide-name{font-size:11px;font-weight:600;color:var(--text-primary);}
.beh-guide-formula{font-size:10px;font-family:monospace;color:var(--accent);background:var(--surface2);padding:2px 6px;border-radius:4px;width:fit-content;}
.beh-guide-desc{font-size:11px;color:var(--text-secondary);line-height:1.65;margin-top:2px;}
.beh-guide-desc b{color:var(--text-primary);font-weight:600;}

/* 페어링 KPI — 신규 카드 주황 강조 */
.mini-kpi-new{border-color:rgba(239,159,39,0.45) !important;background:rgba(239,159,39,0.04);}
.mini-kpi-new .mini-kpi-label{color:#ba7517;}
.mini-kpi-new .mini-kpi-label i{color:#ef9f27;}
.mini-kpi-new .sparkbar-bar{background:#ef9f27;}
.pairing-kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:0;}
@media(max-width:900px){.pairing-kpi-row{grid-template-columns:repeat(3,1fr);}}

/* 페어링 KPI 그룹 구분 */
.kpi-group-wrap{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
.kpi-group{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.kpi-group-new{background:rgba(239,159,39,0.04);border-color:rgba(239,159,39,0.35);}
.kpi-group-label{font-size:11px;font-weight:600;color:var(--text-secondary);display:flex;align-items:center;gap:5px;margin-bottom:10px;letter-spacing:.04em;}
.kpi-group-label.new-label{color:#ba7517;}
.kpi-group-label i{font-size:13px;}
.kpi-group .mini-kpi-row{margin-bottom:0;}

/* 신규 단말 표 테마 (주황) */
.tbl-wrap-new thead th{background:rgba(239,159,39,0.08);}
.tbl-wrap-new thead th.th-cur-new{background:rgba(239,159,39,0.25);color:#8a5500;font-weight:600;}
.tbl-wrap-new tbody td.td-cur-new{background:rgba(239,159,39,0.08);font-weight:500;}
.table-section-new{border-left:3px solid #ef9f27;}
.new-section-title{color:#ba7517 !important;}
.new-section-title i{color:#ef9f27 !important;}
.detail-chart-card-new{border-left:3px solid #ef9f27;background:rgba(239,159,39,0.03);}

/* TABLE */
.table-section{margin-bottom:24px;}
.table-section-title{font-size:12px;font-weight:500;color:var(--text-hint);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.table-section-title i{font-size:14px;}
.tbl-wrap{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{background:var(--surface2);padding:9px 14px;text-align:right;font-size:11px;font-weight:500;color:var(--text-hint);border-bottom:0.5px solid var(--border2);white-space:nowrap;}
thead th:first-child{text-align:left;}
tbody tr{border-bottom:0.5px solid var(--border);}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--surface2);}
tbody td{padding:8px 14px;text-align:right;color:var(--text-primary);white-space:nowrap;}
tbody td:first-child{text-align:left;color:var(--text-secondary);font-size:12px;}
.td-up{color:var(--accent);font-size:11px;}
.td-down{color:var(--danger);font-size:11px;}
.td-bold{font-weight:500;color:var(--text-primary);}

/* CHARTS */
.chart-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:14px;}
@media(max-width:900px){.chart-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.chart-grid{grid-template-columns:1fr;}}
.chart-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.chart-title{font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:3px;}
.chart-subtitle{font-size:11px;color:var(--text-hint);margin-bottom:10px;}
.chart-legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary);}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.chart-canvas-wrap{position:relative;width:100%;height:200px;}

/* LOADING / ERROR */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;gap:12px;}
.spinner{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:13px;color:var(--text-hint);}
.error-box{background:var(--danger-light);border:0.5px solid var(--danger);border-radius:var(--radius);padding:14px 16px;color:var(--danger);font-size:13px;margin:12px 0;}
.ratio-bar{height:3px;background:var(--surface2);border-radius:2px;margin-top:6px;overflow:hidden;}
.ratio-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.3s;}
.last-updated{font-size:11px;color:var(--text-hint);margin-top:16px;text-align:right;}
.page-section{margin-bottom:28px;}

/* SPARK BAR in KPI */
.sparkbar{display:flex;align-items:flex-end;gap:2px;height:28px;margin-top:8px;}
.sparkbar-bar{flex:1;border-radius:2px 2px 0 0;min-height:3px;background:var(--accent);opacity:0.3;transition:opacity 0.15s;}
.sparkbar-bar.current{opacity:1;}

/* DETAIL CHART below KPI row */
.detail-chart-grid{display:grid;gap:10px;margin-bottom:20px;}
.detail-chart-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.detail-chart-title{font-size:12px;font-weight:500;color:var(--text-primary);margin-bottom:2px;}
.detail-chart-sub{font-size:10px;color:var(--text-hint);margin-bottom:8px;}
.detail-chart-wrap{position:relative;width:100%;height:160px;}

/* TRANSPOSED TABLE */
.tbl-wrap-x{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);overflow-x:auto;}
.tbl-wrap-x table{width:max-content;min-width:100%;border-collapse:collapse;font-size:12px;}
.tbl-wrap-x thead th{background:var(--surface2);padding:8px 12px;text-align:right;font-size:11px;font-weight:500;color:var(--text-hint);border-bottom:0.5px solid var(--border2);white-space:nowrap;}
.tbl-wrap-x thead th.th-row{text-align:left;position:sticky;left:0;z-index:2;background:var(--surface2);}
.tbl-wrap-x thead th.th-cur{background:var(--accent-light);color:var(--accent-dark);font-weight:600;}
.tbl-wrap-x tbody tr{border-bottom:0.5px solid var(--border);}
.tbl-wrap-x tbody tr:last-child{border-bottom:none;}
.tbl-wrap-x tbody tr:hover td{background:var(--surface2);}
.tbl-wrap-x tbody td{padding:8px 12px;text-align:right;color:var(--text-primary);white-space:nowrap;}
.tbl-wrap-x tbody td.td-row{text-align:left;color:var(--text-secondary);font-weight:500;font-size:12px;position:sticky;left:0;background:var(--surface);border-right:0.5px solid var(--border);}
.tbl-wrap-x tbody td.td-cur{background:rgba(29,158,117,0.06);font-weight:500;}
.tbl-wrap-x tbody td.td-delta-up{color:var(--accent);font-size:11px;}
.tbl-wrap-x tbody td.td-delta-dn{color:var(--danger);font-size:11px;}
.tbl-wrap-x tbody td.td-delta-neu{color:var(--text-hint);font-size:11px;}

/* ── TREND 레이아웃 ── */
.trend-layout{display:grid;grid-template-columns:172px 1fr 172px;gap:10px;align-items:stretch;height:calc(100vh - 118px);}
.trend-kpi-panel{display:flex;flex-direction:column;gap:8px;height:100%;}
.trend-kpi-section{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:border-color 0.15s,box-shadow 0.15s;flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;}
.trend-kpi-section:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(29,158,117,0.1);}
.trend-kpi-section:hover .trend-kpi-section-title{color:var(--accent);}
.trend-kpi-section-title{font-size:10px;font-weight:700;color:var(--text-secondary);display:flex;align-items:center;gap:4px;margin-bottom:8px;letter-spacing:.05em;text-transform:uppercase;}
.trend-kpi-section-title i{font-size:12px;}
.trend-kpi-section-title .drilldown-hint{margin-left:auto;font-size:10px;color:var(--accent);opacity:0;transition:opacity 0.15s;}
.trend-kpi-section:hover .drilldown-hint{opacity:1;}
.trend-kpi-item{display:flex;align-items:baseline;justify-content:space-between;padding:5px 0;border-bottom:0.5px solid var(--border);gap:4px;}
.trend-kpi-item:last-child{border-bottom:none;padding-bottom:0;}
.trend-kpi-label{font-size:11px;color:var(--text-secondary);flex-shrink:0;}
.trend-kpi-val{font-size:13px;font-weight:600;color:var(--text-primary);text-align:right;}
.trend-kpi-delta{font-size:10px;font-weight:500;white-space:nowrap;text-align:right;}
.trend-kpi-delta.up{color:var(--accent);}
.trend-kpi-delta.dn{color:var(--danger);}
.trend-kpi-delta.neu{color:var(--text-hint);}

/* 2분할 차트 영역 */
.trend-main-chart-wrap{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;height:100%;gap:0;}
.trend-chart-pair{display:flex;flex-direction:column;flex:1;gap:10px;min-height:0;}
.trend-chart-box{flex:1;min-height:0;display:flex;flex-direction:column;border:0.5px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface2);}
.trend-chart-label{font-size:10px;font-weight:600;color:var(--text-secondary);display:flex;align-items:center;gap:5px;margin-bottom:6px;flex-shrink:0;}
.trend-chart-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.trend-chart-box>div:last-child{flex:1;min-height:0;position:relative;}

/* 메뉴 내부 헤더 (탭 + 날짜 네비) */
.menu-header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 16px;gap:12px;flex-wrap:wrap;}
.menu-tab-group{display:flex;background:var(--surface2);border-radius:8px;padding:3px;gap:2px;}
.menu-tab-group-placeholder{flex:1;}
.menu-tab-btn{padding:5px 18px;font-size:12px;font-weight:500;border:none;background:transparent;border-radius:6px;cursor:pointer;color:var(--text-secondary);transition:background 0.15s,color 0.15s;}
.menu-tab-btn.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,0.08);}
.menu-tab-btn:hover:not(.active){color:var(--text-primary);}
.menu-date-nav{display:flex;align-items:center;gap:6px;}
.menu-nav-btn{background:var(--surface2);border:0.5px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--text-secondary);line-height:1;transition:background 0.15s;}
.menu-nav-btn:hover{background:var(--surface);color:var(--text-primary);}

</style>
</head>
<body>

<!-- TOP HEADER -->
<div class="top-header">
  <div class="top-header-title"><i class="ti ti-device-mobile" aria-hidden="true"></i>앱 이용 지표 대시보드</div>

</div>

  <!-- MAIN -->
  <main class="main" id="mainContent">
    <div class="loading"><div class="spinner"></div><div class="loading-text">구글 시트에서 데이터를 불러오는 중...</div></div>
  </main>

<script>
const SHEET_ID = '1rnz0S8YPAgjHu9lzsT3f2yAtjU4XQrxpQioQnAU1eN4';
const SHEETS = {dau:'DAU',tid:'TID',pairing:'%ED%8E%98%EC%96%B4%EB%A7%81',vod:'VOD%20%EC%8B%9C%EC%B2%AD',serial:'%EC%A0%95%EC%A3%BC%ED%96%89%20%EC%8B%9C%EC%B2%AD'};
let allData={}, currentTab='monthly', currentIndex=0, currentMenu='chart';
let dailyRows=[], weeklyRows=[], monthlyRows=[];
let chartInstances={};

/* ── FETCH & PARSE ── */
async function fetchSheet(name){
  const ts=Date.now();
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${name}&_=${ts}`;
  const res=await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error(`시트 로드 실패: ${name} (${res.status})`);
  return parseCSV(await res.text());
}
function parseCSV(text){
  const lines=text.trim().split('\n');
  function splitLine(line){
    const result=[];let cur='';let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){inQ=!inQ;}
      else if(c===','&&!inQ){result.push(cur.trim());cur='';}
      else{cur+=c;}
    }
    result.push(cur.trim());
    return result;
  }
  const headers=splitLine(lines[0]).map(h=>h.replace(/"/g,'').trim());
  return lines.slice(1).map(line=>{
    const vals=splitLine(line);
    const row={};
    headers.forEach((h,i)=>{row[h]=(vals[i]||'').replace(/"/g,'').trim();});
    return row;
  }).filter(r=>r[headers[0]]);
}

/* ── DATES ── */
function parseDate(s){s=String(s).replace(/\D/g,'');return s.length===8?new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8)):null;}
function fmtDate(d){return `${d.getFullYear().toString().slice(2)}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;}
function getWeekStart(d){
  const base=new Date(2025,11,29);
  const offset=Math.floor((d-base)/86400000);
  const ws=new Date(base);
  ws.setDate(base.getDate()+Math.floor(offset/7)*7);
  return ws;
}
function getWeekNo(ws){return Math.floor((ws-new Date(2025,11,29))/86400000/7)+1;}
function getWeekLabel(ws){
  const we=new Date(ws);we.setDate(ws.getDate()+6);
  const wn=getWeekNo(ws);
  const yr=we.getFullYear();
  const mo=String(we.getMonth()+1).padStart(2,'0');
  return `${yr}-${mo}-W${wn} (${fmtDate(ws)}~${fmtDate(we)})`;
}

/* ── NUMBERS ── */
function num(v){return v?parseFloat(String(v).replace(/,/g,'')):0;}
function fmtN(v){if(v===null||v===undefined||isNaN(v))return '-';return Math.round(v).toLocaleString('ko-KR');}
function fmtDelta(cur,prev){
  if(cur===null||prev===null||prev===0)return null;
  const r=(cur-prev)/Math.abs(prev);
  return{text:(r>0?'+':'')+( r*100).toFixed(1)+'%',cls:r>0?'up':r<0?'down':'neutral'};
}
function secToMin(s){return s?(s/60).toFixed(1)+'분':'-';}
function secToHour(s){return s?(s/3600).toFixed(1)+'시간':'-';}

/* ── BUILD ROWS ── */
function buildDailyRows(){
  const rows={};
  Object.keys(SHEETS).forEach(key=>{
    (allData[key]||[]).forEach(r=>{
      const d=parseDate(Object.values(r)[0]);if(!d)return;
      const dk=d.toISOString().slice(0,10);
      if(!rows[dk])rows[dk]={date:d};
      rows[dk][key]=r;
    });
  });
  return Object.values(rows).sort((a,b)=>a.date-b.date);
}

function tidField(){return Object.keys(allData.tid?.[0]||{})[1]||'T ID 전체';}
function tidFieldSKB(){return Object.keys(allData.tid?.[0]||{})[2]||null;}    // C열 SKB
function tidFieldPaired(){return Object.keys(allData.tid?.[0]||{})[3]||null;} // D열 페어링
function tidFieldUnpaired(){return Object.keys(allData.tid?.[0]||{})[4]||null;}// E열 미페어링
function tidFieldOther(){return Object.keys(allData.tid?.[0]||{})[5]||null;}   // F열 타사

function buildWeeklyRows(dr){
  const weeks={};
  dr.forEach(row=>{
    const ws=getWeekStart(row.date);const wk=ws.toISOString().slice(0,10);
    if(!weeks[wk])weeks[wk]={weekStart:ws,days:[]};
    weeks[wk].days.push(row);
  });
  return Object.values(weeks).sort((a,b)=>a.weekStart-b.weekStart).map(w=>{
    const days=w.days;
    const avg=(key,field)=>days.filter(d=>d[key]).reduce((s,d)=>s+num(d[key]?.[field]||0),0)/Math.max(days.filter(d=>d[key]).length,1);
    const sum=(key,field)=>days.filter(d=>d[key]).reduce((s,d)=>s+num(d[key]?.[field]||0),0);
    const last=(key,field)=>{const d=[...days].reverse().find(d=>d[key]);return d?num(d[key][field]):null;};
    const tf=tidField();
    return{
      weekStart:w.weekStart,label:getWeekLabel(w.weekStart),
      dau:avg('dau','DAU'),mau:last('dau','MAU'),
      tid:last('tid',tf),
      tid_skb:last('tid',tidFieldSKB()),
      tid_paired:last('tid',tidFieldPaired()),
      tid_unpaired:last('tid',tidFieldUnpaired()),
      get tid_other(){return(this.tid!==null&&this.tid_skb!==null)?this.tid-this.tid_skb:null;},
      pairing_total:(last('pairing','유효단말')??0)+(last('pairing','비유효단말')??0)||null,
      pairing_valid:last('pairing','유효단말'),pairing_invalid:last('pairing','비유효단말'),
      pairing_new:sum('pairing','신규등록'),
      vod_viewers:avg('vod','프로필자수'),vod_count:sum('vod','시청건수'),vod_time:sum('vod','시청시간'),
      serial_viewers:avg('serial','프로필자수'),serial_count:sum('serial','시청건수'),serial_time:sum('serial','시청시간'),
    };
  });
}

function buildMonthlyRows(dr){
  const months={};
  dr.forEach(row=>{
    const mk=`${row.date.getFullYear()}-${String(row.date.getMonth()+1).padStart(2,'0')}`;
    if(!months[mk])months[mk]={year:row.date.getFullYear(),month:row.date.getMonth()+1,days:[]};
    months[mk].days.push(row);
  });
  return Object.values(months).sort((a,b)=>a.year!==b.year?a.year-b.year:a.month-b.month).map(m=>{
    const days=m.days;
    const avg=(key,field)=>days.filter(d=>d[key]).reduce((s,d)=>s+num(d[key]?.[field]||0),0)/Math.max(days.filter(d=>d[key]).length,1);
    const sum=(key,field)=>days.filter(d=>d[key]).reduce((s,d)=>s+num(d[key]?.[field]||0),0);
    const last=(key,field)=>{const d=[...days].reverse().find(d=>d[key]);return d?num(d[key][field]):null;};
    const tf=tidField();
    return{
      year:m.year,month:m.month,label:`${m.year}년 ${m.month}월`,
      dau:avg('dau','DAU'),mau:last('dau','MAU'),
      tid:last('tid',tf),
      tid_skb:last('tid',tidFieldSKB()),
      tid_paired:last('tid',tidFieldPaired()),
      tid_unpaired:last('tid',tidFieldUnpaired()),
      get tid_other(){return(this.tid!==null&&this.tid_skb!==null)?this.tid-this.tid_skb:null;},
      pairing_total:(last('pairing','유효단말')??0)+(last('pairing','비유효단말')??0)||null,
      pairing_valid:last('pairing','유효단말'),pairing_invalid:last('pairing','비유효단말'),
      pairing_new:sum('pairing','신규등록'),
      vod_viewers:avg('vod','프로필자수'),vod_count:sum('vod','시청건수'),vod_time:sum('vod','시청시간'),
      serial_viewers:avg('serial','프로필자수'),serial_count:sum('serial','시청건수'),serial_time:sum('serial','시청시간'),
    };
  });
}

/* ── INIT ── */
async function init(){
  const el=document.getElementById('mainContent');
  try{
    el.innerHTML='<div class="loading"><div class="spinner"></div><div class="loading-text" id="loadMsg">DAU 시트 로딩 중...</div></div>';
    const setMsg=m=>{const e=document.getElementById('loadMsg');if(e)e.textContent=m;};

    setMsg('DAU 시트 로딩 중...');
    const dau=await fetchSheet(SHEETS.dau);
    setMsg('TID 시트 로딩 중...');
    const tid=await fetchSheet(SHEETS.tid);
    setMsg('페어링 시트 로딩 중...');
    const pairing=await fetchSheet(SHEETS.pairing);
    setMsg('VOD 시청 시트 로딩 중...');
    const vod=await fetchSheet(SHEETS.vod);
    setMsg('정주행 시청 시트 로딩 중...');
    const serial=await fetchSheet(SHEETS.serial);

    allData={dau,tid,pairing,vod,serial};
    setMsg('집계 중...');
    dailyRows=buildDailyRows();
    weeklyRows=buildWeeklyRows(dailyRows);
    monthlyRows=buildMonthlyRows(dailyRows);
    currentIndex=monthlyRows.length-1;
    render();
  }catch(e){
    console.error('init error:', e);
    el.innerHTML=`<div class="error-box"><i class="ti ti-alert-circle"></i> 데이터 로딩 오류: ${e.message}<br><small>${e.stack||''}</small></div>`;
  }
}

/* ── NAVIGATION ── */
function getRows(){return currentTab==='weekly'?weeklyRows:monthlyRows;}
function navigate(dir){
  const rows=getRows();
  currentIndex=Math.max(0,Math.min(rows.length-1,currentIndex+dir));
  render();
}
function switchTab(tab){
  if(currentMenu==='chart') return; // Trend는 월간 고정
  currentTab=tab;
  currentIndex=getRows().length-1;
  render();
}
function switchMenu(menu){
  currentMenu=menu;
  document.querySelectorAll('.menu-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('menu-'+menu).classList.add('active');
  // Trend 메뉴는 항상 월간 기준
  if(menu==='chart' && currentTab!=='monthly'){
    currentTab='monthly';
    // 탭은 메뉴 내부 buildMenuHeader가 렌더 시 state 반영
    currentIndex=monthlyRows.length-1;
  }
  render();
}

/* ── CURRENT VALUES ── */
function getCurPrev(){
  const rows=getRows();if(!rows.length)return{cur:null,prev:null};
  const idx=Math.min(currentIndex,rows.length-1);
  return{cur:rows[idx],prev:idx>0?rows[idx-1]:null};
}
function getVal(row,key,field,aggKey){
  return row?.[aggKey]??null;
}

/* ── 전월 동기간 기준일 계산 ──
   주간: weekStart + 6일 = 마지막일 → 전월 동일일
   월간: 해당 월 마지막일 → 전월 동일일
   반환: { lastDay, momDay, momDailyRow, momDauAvg }
*/
function getMomBaseline(curRow){
  const tf=tidField();
  let lastDay;
  if(currentTab==='weekly'){
    lastDay=new Date(curRow.weekStart); lastDay.setDate(curRow.weekStart.getDate()+6);
  } else {
    lastDay=new Date(curRow.year, curRow.month, 0); // 해당 월 마지막일
  }
  // 전월 동일일
  const momDay=new Date(lastDay.getFullYear(), lastDay.getMonth()-1, lastDay.getDate());
  const momDk=momDay.toISOString().slice(0,10);

  // dailyRows에서 전월 동일일 row 조회
  const momDailyRow=dailyRows.find(r=>r.date.toISOString().slice(0,10)===momDk)||null;

  // DAU: 전월 1일 ~ momDay 평균
  const momY=momDay.getFullYear(), momM=momDay.getMonth();
  const momStart=new Date(momY,momM,1).toISOString().slice(0,10);
  const momEnd=momDk;
  const momDauDays=dailyRows.filter(r=>{
    const dk=r.date.toISOString().slice(0,10);
    return dk>=momStart && dk<=momEnd && r.dau;
  });
  const momDauAvg=momDauDays.length
    ? momDauDays.reduce((s,r)=>s+num(r.dau?.['DAU']||0),0)/momDauDays.length
    : null;

  return{lastDay, momDay, momDailyRow, momDauAvg, tf};
}

/* ── MINI KPI HTML ── */
function miniKpi(label,icon,value,sub,delta,accent,extra){
  const d=delta?fmtDelta(delta.cur,delta.prev):null;
  const badge=d?`<span class="mini-badge ${d.cls}">${d.text}</span>`:'';
  return `<div class="mini-kpi${accent?' accent':''}">
    <div class="mini-kpi-label"><i class="ti ti-${icon}" aria-hidden="true"></i>${label}</div>
    <div class="mini-kpi-value">${value}</div>
    ${sub?`<div class="mini-kpi-sub">${sub}</div>`:''}
    ${badge}
    ${extra||''}
  </div>`;
}

/* ── TABLE HELPERS ── */
function compareLabel(){return currentTab==='weekly'?'WoW':'MoM';}

/* 전치 표용 delta 셀: ▲▼ 아이콘 + % */
function tdDeltaT(cur,prev,isPercPoint){
  if(cur===null||prev===null||prev===0)return '<td class="td-delta-neu">-</td>';
  const r=(cur-prev)/Math.abs(prev);
  if(isPercPoint){
    const diff=(cur-prev).toFixed(1);
    const cls=r>0?'td-delta-up':r<0?'td-delta-dn':'td-delta-neu';
    const icon=r>0?'▲':r<0?'▼':'';
    return `<td class="${cls}">${icon} ${r>0?'+':''}${diff}%p</td>`;
  }
  const cls=r>0?'td-delta-up':r<0?'td-delta-dn':'td-delta-neu';
  const icon=r>0?'▲':r<0?'▼':'';
  return `<td class="${cls}">${icon} ${r>0?'+':''}${(r*100).toFixed(1)}%</td>`;
}

/* 스파크바 HTML */
function sparkbarHtml(valArr,curIdx){
  if(!valArr||valArr.length===0)return '';
  const valid=valArr.map(v=>v??0);
  const mx=Math.max(...valid,1);
  const bars=valid.map((v,i)=>{
    const h=Math.max(Math.round((v/mx)*100),4);
    const isCur=(i===curIdx);
    return `<div class="sparkbar-bar${isCur?' current':''}" style="height:${h}%"></div>`;
  }).join('');
  return `<div class="sparkbar">${bars}</div>`;
}

/* 전치 표 공통 빌더
   metrics 각 항목에 sectionColor 지정 시 행 배경 + 지표명 컬러 적용
   예: {label:'신규등록', sectionColor:'new', ...}
   sectionColor: 'new'(골드) | undefined(기본)
*/
function buildTransposedTable(metrics, colLabels, curColIdx){
  const cLabel=compareLabel();
  const thCells=colLabels.map((l,i)=>`<th class="${i===curColIdx?'th-cur':''}">${l}</th>`).join('');
  const rows=metrics.map(m=>{
    const {label,vals,fmt,isPercPoint,sectionColor}=m;
    const f=fmt||fmtN;
    const cur=vals[curColIdx]??null;
    const prev=curColIdx>0?(vals[curColIdx-1]??null):null;
    const sc=sectionColor?`tbl-section-${sectionColor}`:'';
    const dataCells=vals.map((v,i)=>{
      const isCur=(i===curColIdx);
      return `<td class="${[isCur?'td-cur':'',sc].filter(Boolean).join(' ')}">${f(v)}</td>`;
    }).join('');
    return`<tr class="${sc}"><td class="td-row ${sc}">${label}</td>${dataCells}${tdDeltaT(cur,prev,isPercPoint)}</tr>`;
  }).join('');
  return `<div class="tbl-wrap-x"><table>
    <thead><tr><th class="th-row">지표</th>${thCells}<th>${cLabel}</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

/* ── DATE LABEL ── */
function getDateLabelText(){
  const rows=getRows();if(!rows.length)return'-';
  const idx=Math.min(currentIndex,rows.length-1);
  const cur=rows[idx];
  if(currentTab==='weekly'){return`${cur.weekStart.getFullYear()}-${String(cur.weekStart.getMonth()+1).padStart(2,'0')}-W${getWeekNo(cur.weekStart)} (${fmtDate(cur.weekStart)}~${fmtDate(new Date(cur.weekStart.getTime()+6*86400000))})`;}
  return cur.label;
}
function updateDateLabel(){
  // 메뉴 내부 dateLabel 업데이트
  const el=document.getElementById('menuDateLabel');
  if(el) el.textContent=getDateLabelText();
}

/* 메뉴 상단 공통 헤더: 탭 + 날짜 네비
   showTabs: false면 탭 숨김 (Trend 전용)
*/
function buildMenuHeader(showTabs=true){
  const tabs = showTabs ? `
    <div class="menu-tab-group">
      <button class="menu-tab-btn${currentTab==='weekly'?' active':''}" onclick="switchTab('weekly')">주간</button>
      <button class="menu-tab-btn${currentTab==='monthly'?' active':''}" onclick="switchTab('monthly')">월간</button>
    </div>` : `<div class="menu-tab-group-placeholder"></div>`;
  return `<div class="menu-header">
    ${tabs}
    <div class="menu-date-nav">
      <button class="menu-nav-btn" onclick="navigate(-1)"><i class="ti ti-chevron-left"></i></button>
      <span class="menu-date-label" id="menuDateLabel">${getDateLabelText()}</span>
      <button class="menu-nav-btn" onclick="navigate(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
  </div>`;
}

/* ── TIME FORMAT ── */
function fmtTime(sec){return secToHour(sec);}
function timeUnitLabel(){return '(시간)';}

/* ══════════════════════════════
   RENDER
══════════════════════════════ */
function render(){
  updateDateLabel();
  destroyCharts();
  if(currentMenu==='chart') renderChart();
  else if(currentMenu==='pairing') renderPairing();
  else if(currentMenu==='daumau') renderDauMau();
  else if(currentMenu==='tid') renderTid();
  else if(currentMenu==='viewing') renderViewing();
}

/* ── CHART MENU ── */
function renderChart(){
  const rows=getRows();
  const n=12;
  const end=Math.min(currentIndex+1,rows.length);
  const slice=rows.slice(Math.max(0,end-n),end);
  const{cur,prev}=getCurPrev();
  if(!cur){document.getElementById('mainContent').innerHTML='<div class="loading"><div class="loading-text">데이터 없음</div></div>';return;}

  const labels=slice.map(r=>{
    if(currentTab==='weekly'){const ws=r.weekStart;return`${ws.getFullYear()}-${String(ws.getMonth()+1).padStart(2,'0')}-W${getWeekNo(ws)}`;}
    return`${r.year}년 ${r.month}월`;
  });

  /* KPI 값 */
  const pValid=cur.pairing_valid??null, pInvalid=cur.pairing_invalid??null;
  const pTotal=(pValid??0)+(pInvalid??0)||null;
  const pValidPrev=prev?(prev.pairing_valid??null):null;
  const pInvalidPrev=prev?(prev.pairing_invalid??null):null;
  const pTotalPrev=prev?((prev.pairing_valid??0)+(prev.pairing_invalid??0)||null):null;
  const dauVal=cur.dau??null, dauPrev=prev?(prev.dau??null):null;
  const mauVal=cur.mau??null, mauPrev=prev?(prev.mau??null):null;
  const tidSkb=cur.tid_skb??null, tidSkbPrev=prev?(prev.tid_skb??null):null;
  const tidOther=cur.tid_other??null, tidOtherPrev=prev?(prev.tid_other??null):null;
  const tidTotal=cur.tid??null, tidTotalPrev=prev?(prev.tid??null):null;
  const dauSub=currentTab==='weekly'?'주간 일평균':'월간 일평균';
  const periodSub=currentTab==='weekly'?'주 마지막일':'월 마지막일';
  const cLabel=compareLabel();

  function kpiItem(label, val, prevVal, isPercPoint){
    if(val===null)return`<div class="trend-kpi-item"><span class="trend-kpi-label">${label}</span><span class="trend-kpi-val">-</span></div>`;

/* ── SHARED TABLE HELPERS ── */
function getSlice(n){
  n=n||12;
  const rows=getRows();
  const end=Math.min(currentIndex+1,rows.length);
  return rows.slice(Math.max(0,end-n),end); // 오래된→최신 순
}
/* 주차 레이블: YYYY-MM-Wn (목요일 귀속 기준, 업로드 파일 getWL 방식) */
function getWL(d){
  if(!(d instanceof Date)||isNaN(d)) return null;
  const dow=d.getDay(), diff=dow===0?-6:1-dow;
  const mon=new Date(d); mon.setDate(d.getDate()+diff);
  const thu=new Date(mon); thu.setDate(mon.getDate()+3);
  const y=thu.getFullYear(), m=thu.getMonth()+1;
  const f=new Date(y,m-1,1), fd=f.getDay(), dt=(4-fd+7)%7;
  const ft=new Date(f); ft.setDate(1+dt);
  const wn=Math.floor((thu-ft)/(7*864e5))+1;
  return `${y}-${String(m).padStart(2,'0')}-W${wn}`;
}
function rowShortLabel(r){
  if(currentTab==='weekly'){
    const lbl=getWL(r.weekStart);
    return lbl||`W${getWeekNo(r.weekStart)}`;
  }
  return `${r.year%100}/${String(r.month).padStart(2,'0')}`;
}
function rowLabel(r){
  if(currentTab==='weekly'){const ws=r.weekStart;return `${ws.getFullYear()}-${String(ws.getMonth()+1).padStart(2,'0')}-W${getWeekNo(ws)} (${fmtDate(ws)}~${fmtDate(new Date(ws.getTime()+6*86400000))})`;}
  return r.label;
}

/* KPI 카드 + 스파크바 + 아래 미니 차트를 포함한 섹션 빌더 */
function buildKpiSection(kpiCards, chartConfigs, sliceArr){
  // kpiCards: [{label, icon, value, sub, delta, accent}]
  // chartConfigs: [{id, title, sub, datasets, timeOpts}]
  const n = sliceArr.length;
  const curIdx = n - 1;

  // KPI row
  const kpiHtml = kpiCards.map(k=>{
    const d = k.delta ? fmtDelta(k.delta.cur, k.delta.prev) : null;
    const icon = d ? (d.cls==='up'?'▲':d.cls==='down'?'▼':'') : '';
    const badgeCls = d ? d.cls : '';
    const badge = d ? `<span class="mini-badge ${badgeCls}">${icon} ${d.text}</span>` : '';
    const spark = k.sparkVals ? sparkbarHtml(k.sparkVals, curIdx) : '';
    const momLine = (()=>{
      if(k.momVal===undefined||k.momVal===null) return '';
      const momDisp = k.momFmt ? k.momFmt(k.momVal) : fmtN(k.momVal);
      // 현재값(숫자)과 전월값 비교 — momVal이 숫자, delta.cur이 현재값
      const curNum = k.delta?.cur??null;
      let momDelta = '';
      if(curNum!==null && k.momVal!==null && k.momVal!==0){
        const r=(curNum-k.momVal)/Math.abs(k.momVal);
        const pct=(r*100).toFixed(1);
        const ic=r>0?'▲':r<0?'▼':'';
        const cls=r>0?'mom-up':r<0?'mom-dn':'mom-neu';
        momDelta=`<span class="mini-kpi-mom-delta ${cls}">${ic} ${r>0?'+':''}${pct}%</span>`;
      }
      return `<div class="mini-kpi-mom"><i class="ti ti-calendar-month" aria-hidden="true"></i>전월 동기간 ${momDisp}${momDelta}</div>`;
    })();
    return `<div class="mini-kpi${k.accent?' accent':''}">
      <div class="mini-kpi-label"><i class="ti ti-${k.icon}" aria-hidden="true"></i>${k.label}</div>
      <div class="mini-kpi-value">${k.value}</div>
      ${k.sub?`<div class="mini-kpi-sub">${k.sub}</div>`:''}
      ${badge}${momLine}${spark}
    </div>`;
  }).join('');

  // Chart grid
  const cols = chartConfigs.length === 1 ? '1fr' : chartConfigs.length === 2 ? '1fr 1fr' : 'repeat(3,1fr)';
  const chartCards = chartConfigs.map(c=>`
    <div class="detail-chart-card">
      <div class="detail-chart-title">${c.title}</div>
      <div class="detail-chart-sub">${c.sub||''}</div>
      <div class="detail-chart-wrap"><canvas id="${c.id}"></canvas></div>
    </div>`).join('');

  return `<div class="mini-kpi-row">${kpiHtml}</div>
  <div class="detail-chart-grid" style="grid-template-columns:${cols}">${chartCards}</div>`;
}

/* T아이디 통합 전치표: group별 행 배경색 구분 */
function buildTransposedTableTid(metrics, colLabels, curColIdx){
  const cLabel=compareLabel();
  const thCells=colLabels.map((l,i)=>`<th class="${i===curColIdx?'th-cur':''}">${l}</th>`).join('');

  // 그룹 헤더 행 생성
  const groupMeta={
    total:{label:null, rowCls:''},
    sub:  {label:'자사구분', rowCls:'tid-row-sub', headerCls:'tid-group-header-sub'},
    pair: {label:'페어링 여부', rowCls:'tid-row-pair', headerCls:'tid-group-header-pair'},
  };
  let lastGroup=null;
  const rows=metrics.map(m=>{
    const{label,vals,fmt,isPercPoint,group}=m;
    const f=fmt||fmtN;
    const cur=vals[curColIdx]??null;
    const prev=curColIdx>0?(vals[curColIdx-1]??null):null;
    const dataCells=vals.map((v,i)=>`<td class="${i===curColIdx?'td-cur':''}">${f(v)}</td>`).join('');
    const rowCls=groupMeta[group]?.rowCls||'';
    // 그룹 헤더 삽입
    let groupHeader='';
    if(group!=='total' && group!==lastGroup){
      const hcls=groupMeta[group]?.headerCls||'';
      const colSpan=colLabels.length+2;
      groupHeader=`<tr class="tid-group-header ${hcls}"><td colspan="${colSpan}">${groupMeta[group].label}</td></tr>`;
    }
    lastGroup=group;
    return groupHeader+`<tr class="${rowCls}"><td class="td-row">${label}</td>${dataCells}${tdDeltaT(cur,prev,isPercPoint)}</tr>`;
  }).join('');

  return`<div class="tbl-wrap-x"><table>
    <thead><tr><th class="th-row">지표</th>${thCells}<th>${cLabel}</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

  const curHL=slice.map((_,i)=>i===curIdx);

  const kpiCards=[
    {label:'T아이디 전체',icon:'id-badge',value:fmtN(tidVal),sub:periodSub,
     delta:{cur:tidVal,prev:tidPrev},accent:true,momVal:momTid,
     sparkVals:slice.map(r=>r.tid??null)},
    {label:'SKB',icon:'building',value:fmtN(tidSkb),sub:periodSub,
     delta:{cur:tidSkb,prev:tidSkbPrev},momVal:momSkb,
     sparkVals:slice.map(r=>r.tid_skb??null)},
    {label:'타사',icon:'building-community',value:fmtN(tidOther),sub:'전체 - SKB',
     delta:{cur:tidOther,prev:tidOtherPrev},
     sparkVals:slice.map(r=>r.tid_other??null)},
  ];

  const chartConfigs=[
    {id:'cTidTotal2',title:'T아이디 전체 추이',sub:periodSub},
    {id:'cTidType2',title:'자사구분 추이',sub:'SKB / 타사'},
    {id:'cTidPair2',title:'페어링 여부 추이',sub:'페어링 / 미페어링'},
  ];

  /* 통합 전치표: 그룹별 배경색 구분 */
  const fmtR=v=>v===null?'-':v.toFixed(1)+'%';
  const metricsAll=[
    // 전체 그룹
    {label:'T아이디 전체', vals:slice.map(r=>r.tid??null), group:'total'},
    // 자사구분 그룹
    {label:'SKB',          vals:slice.map(r=>r.tid_skb??null), group:'sub'},
    {label:'타사',          vals:slice.map(r=>r.tid_other??null), group:'sub'},
    {label:'SKB 비율',      vals:slice.map(r=>(r.tid&&r.tid_skb)?(r.tid_skb/r.tid*100):null),
     fmt:fmtR, isPercPoint:true, group:'sub'},
    // 페어링여부 그룹
    {label:'페어링',        vals:slice.map(r=>r.tid_paired??null), group:'pair'},
    {label:'미페어링',      vals:slice.map(r=>r.tid_unpaired??null), group:'pair'},
    {label:'페어링 비율',   vals:slice.map(r=>(r.tid&&r.tid_paired)?(r.tid_paired/r.tid*100):null),
     fmt:fmtR, isPercPoint:true, group:'pair'},
  ];

  document.getElementById('mainContent').innerHTML=
    buildMenuHeader()+
    buildKpiSection(kpiCards,chartConfigs,slice)+
    `<div class="page-section">
      <div class="table-section">
        <div class="table-section-title"><i class="ti ti-id-badge"></i>T아이디 추이</div>
        ${buildTransposedTableTid(metricsAll,colLabels,curIdx)}
      </div>
    </div>`;

  const labels=slice.map(rowShortLabel); const bo=baseOptsDetail(); const leg={display:true,position:'bottom',labels:{boxWidth:10,font:{size:10}}};

  chartInstances.tidTotal2=new Chart(document.getElementById('cTidTotal2'),{type:'line',data:{labels,datasets:[
    {label:'T아이디',data:slice.map(r=>r.tid??null),borderColor:'#7f77dd',backgroundColor:'rgba(127,119,221,0.08)',tension:0.3,fill:true,borderWidth:2,
     pointRadius:curHL.map(b=>b?5:2),pointBackgroundColor:curHL.map(b=>b?'#7f77dd':'rgba(127,119,221,0.4)')},
  ]},options:{...bo,plugins:{...bo.plugins,legend:leg}}});

  chartInstances.tidType2=new Chart(document.getElementById('cTidType2'),{type:'bar',data:{labels,datasets:[
    {label:'SKB',data:slice.map(r=>r.tid_skb??null),backgroundColor:curHL.map(b=>b?'#7f77dd':'rgba(127,119,221,0.4)'),borderRadius:3},
    {label:'타사',data:slice.map(r=>r.tid_other??null),backgroundColor:curHL.map(b=>b?'#378add':'rgba(55,138,221,0.4)'),borderRadius:3},
  ]},options:{...bo,plugins:{...bo.plugins,legend:leg}}});

  chartInstances.tidPair2=new Chart(document.getElementById('cTidPair2'),{type:'bar',data:{labels,datasets:[
    {label:'페어링',data:slice.map(r=>r.tid_paired??null),backgroundColor:curHL.map(b=>b?'#1d9e75':'rgba(29,158,117,0.4)'),borderRadius:3},
    {label:'미페어링',data:slice.map(r=>r.tid_unpaired??null),backgroundColor:curHL.map(b=>b?'#d85a30':'rgba(216,90,48,0.4)'),borderRadius:3},
  ]},options:{...bo,plugins:{...bo.plugins,legend:leg}}});
}

/* ── VIEWING MENU ── */
function renderViewing(){
  const{cur,prev}=getCurPrev();
  if(!cur){document.getElementById('mainContent').innerHTML='<div class="loading"><div class="loading-text">데이터 없음</div></div>';return;}

  const vodV=cur.vod_viewers??null; const vodC=cur.vod_count??null; const vodT=cur.vod_time??null;
  const serV=cur.serial_viewers??null; const serC=cur.serial_count??null; const serT=cur.serial_time??null;
  const prevVodV=prev?(prev.vod_viewers??null):null; const prevVodC=prev?(prev.vod_count??null):null; const prevVodT=prev?(prev.vod_time??null):null;
  const prevSerV=prev?(prev.serial_viewers??null):null; const prevSerC=prev?(prev.serial_count??null):null; const prevSerT=prev?(prev.serial_time??null):null;

  const viewerSub=currentTab==='weekly'?'주간 일평균':'월간 일평균';
  const countSub=currentTab==='weekly'?'주간 누적':'월간 누적';

  const slice=getSlice();
  const curIdx=slice.length-1;
  const colLabels=slice.map(rowShortLabel);

  const kpiCards=[
    {label:'VOD 시청자수',icon:'eye',value:fmtN(vodV),sub:viewerSub,delta:{cur:vodV,prev:prevVodV},sparkVals:slice.map(r=>r.vod_viewers??null)},
    {label:'VOD 시청건수',icon:'list-numbers',value:fmtN(vodC),sub:countSub,delta:{cur:vodC,prev:prevVodC},sparkVals:slice.map(r=>r.vod_count??null)},
    {label:'VOD 시청시간',icon:'clock',value:fmtTime(vodT),sub:'시간',delta:{cur:vodT,prev:prevVodT},sparkVals:slice.map(r=>r.vod_time??null)},
    {label:'정주행 시청자수',icon:'eye',value:fmtN(serV),sub:viewerSub,delta:{cur:serV,prev:prevSerV},sparkVals:slice.map(r=>r.serial_viewers??null)},
    {label:'정주행 시청건수',icon:'list-numbers',value:fmtN(serC),sub:countSub,delta:{cur:serC,prev:prevSerC},sparkVals:slice.map(r=>r.serial_count??null)},
    {label:'정주행 시청시간',icon:'clock',value:fmtTime(serT),sub:'시간',delta:{cur:serT,prev:prevSerT},sparkVals:slice.map(r=>r.serial_time??null)},
  ];
  const chartConfigs=[
    {id:'cVodViewers',title:'시청자수 추이',sub:'VOD / 정주행 일평균'},
    {id:'cVodCount',title:'시청건수 추이',sub:'VOD / 정주행 누적'},
    {id:'cVodTime',title:'시청시간 추이',sub:'VOD / 정주행 (시간)'},
  ];
  const fmtTimeV=v=>v===null?'-':(v/3600).toFixed(1)+'h';
  const metrics=[
    {label:'VOD 시청자수',vals:slice.map(r=>r.vod_viewers??null)},
    {label:'VOD 시청건수',vals:slice.map(r=>r.vod_count??null)},
    {label:'VOD 시청시간',vals:slice.map(r=>r.vod_time??null),fmt:v=>v===null?'-':(v/3600).toFixed(1)+'h'},
    {label:'정주행 시청자수',vals:slice.map(r=>r.serial_viewers??null)},
    {label:'정주행 시청건수',vals:slice.map(r=>r.serial_count??null)},
    {label:'정주행 시청시간',vals:slice.map(r=>r.serial_time??null),fmt:v=>v===null?'-':(v/3600).toFixed(1)+'h'},
  ];

  document.getElementById('mainContent').innerHTML=
    buildMenuHeader()+
    buildKpiSection(kpiCards, chartConfigs, slice)+
    `<div class="page-section">
      <div class="table-section">
        <div class="table-section-title"><i class="ti ti-player-play"></i>시청 추이</div>
        ${buildTransposedTable(metrics, colLabels, curIdx)}
      </div>
    </div>`;

  const labels=slice.map(rowShortLabel);
  const bo=baseOptsDetail();
  const curHL=slice.map((_,i)=>i===curIdx);
  chartInstances.vodViewers=new Chart(document.getElementById('cVodViewers'),{type:'line',data:{labels,datasets:[
    {label:'VOD',data:slice.map(r=>r.vod_viewers??null),borderColor:'#378add',tension:0.3,pointRadius:curHL.map(b=>b?5:2),pointBackgroundColor:curHL.map(b=>b?'#378add':'rgba(55,138,221,0.4)'),borderWidth:2},
    {label:'정주행',data:slice.map(r=>r.serial_viewers??null),borderColor:'#ef9f27',tension:0.3,pointRadius:curHL.map(b=>b?5:2),pointBackgroundColor:curHL.map(b=>b?'#ef9f27':'rgba(239,159,39,0.4)'),borderDash:[4,3],borderWidth:1.5},
  ]},options:{...bo,plugins:{...bo.plugins,legend:{display:true,position:'bottom',labels:{boxWidth:10,font:{size:10}}}}}});
  chartInstances.vodCount=new Chart(document.getElementById('cVodCount'),{type:'bar',data:{labels,datasets:[
    {label:'VOD',data:slice.map(r=>r.vod_count??null),backgroundColor:curHL.map(b=>b?'#378add':'rgba(55,138,221,0.4)'),borderRadius:3},
    {label:'정주행',data:slice.map(r=>r.serial_count??null),backgroundColor:curHL.map(b=>b?'#ef9f27':'rgba(239,159,39,0.4)'),borderRadius:3},
  ]},options:{...bo,plugins:{...bo.plugins,legend:{display:true,position:'bottom',labels:{boxWidth:10,font:{size:10}}}}}});
  const timeOpts={...baseOptsDetail(v=>`${v.toFixed(1)}h`),plugins:{...bo.plugins,legend:{display:true,position:'bottom',labels:{boxWidth:10,font:{size:10}}}}};
  chartInstances.vodTime=new Chart(document.getElementById('cVodTime'),{type:'bar',data:{labels,datasets:[
    {label:'VOD',data:slice.map(r=>r.vod_time?(r.vod_time/3600):null),backgroundColor:curHL.map(b=>b?'#378add':'rgba(55,138,221,0.4)'),borderRadius:3},
    {label:'정주행',data:slice.map(r=>r.serial_time?(r.serial_time/3600):null),backgroundColor:curHL.map(b=>b?'#ef9f27':'rgba(239,159,39,0.4)'),borderRadius:3},
  ]},options:timeOpts});
}

/* ── CHART UTILS ── */
function fmtK(v){return Math.abs(v)>=10000?(v/10000).toFixed(0)+'만':Math.round(v).toLocaleString('ko-KR');}
function baseOpts(){
  return{
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${Math.round(ctx.raw).toLocaleString('ko-KR')}`}}},
    scales:{
      x:{grid:{display:false},ticks:{font:{size:10},color:'#888780',maxRotation:45,autoSkip:true,maxTicksLimit:10}},
      y:{grid:{color:'rgba(136,135,128,0.13)'},ticks:{font:{size:10},color:'#888780',callback:fmtK}}
    }
  };
}
function destroyCharts(){Object.values(chartInstances).forEach(c=>{try{c.destroy();}catch(e){}});chartInstances={};}

init();
</script>
</body>
</html>
