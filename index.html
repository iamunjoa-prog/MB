<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>앱 이용 현황</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sidebar-w: 200px;
    --bg: #f5f5f7;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.08);
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #aeaeb2;
    --accent: #0071e3;
    --accent-light: #e8f1fb;
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 18px;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
  }

  .main {
    margin-left: var(--sidebar-w);
    flex: 1;
    min-height: 100vh;
    padding: 32px 36px;
    min-width: 0;
    overflow-x: hidden;
  }

  /* ── 사이드바 ── */
  .sidebar {
    width: var(--sidebar-w);
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0;
    z-index: 100;
  }

  .sidebar-logo {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo .app-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.3px;
  }
  .sidebar-logo .app-sub {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 2px;
  }

  .nav-section {
    padding: 16px 12px 8px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-tertiary);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 12px;
    margin: 2px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: background 0.15s, color 0.15s;
    text-decoration: none;
  }
  .nav-item:hover { background: var(--bg); color: var(--text-primary); }
  .nav-item.active { background: var(--accent-light); color: var(--accent); }

  .nav-icon {
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .sidebar-footer {
    margin-top: auto;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
  }
  .data-source {
    font-size: 10px;
    color: var(--text-tertiary);
    line-height: 1.5;
  }
  .data-source span { color: var(--accent); font-weight: 500; }

  /* ── 메인 ── */

  .page-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .page-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text-primary);
  }
  .page-sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .month-selector {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
  }
  .month-selector select {
    font-size: 13px;
    font-family: var(--font);
    font-weight: 500;
    color: var(--text-primary);
    border: none;
    background: transparent;
    outline: none;
    cursor: pointer;
  }

  /* ── 상태 배너 ── */
  #status-banner {
    background: #fff8e7;
    border: 1px solid #f0c840;
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    font-size: 12px;
    color: #856404;
    margin-bottom: 20px;
    display: none;
    align-items: center;
    gap: 8px;
  }

  /* ── KPI 카드 ── */
  .kpi-section { margin-bottom: 28px; }
  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* 전체 MAU 카드 */
  .kpi-total {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 24px 28px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid var(--border);
  }
  .kpi-total-left .label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .kpi-total-left .value {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--text-primary);
  }
  .kpi-total-left .value span { font-size: 18px; font-weight: 500; margin-left: 4px; color: var(--text-secondary); }
  .mom-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    margin-top: 8px;
  }
  .mom-badge.up { background: #e8faf0; color: #1a7f4b; }
  .mom-badge.down { background: #fde8e8; color: #c0392b; }
  .mom-badge.flat { background: var(--bg); color: var(--text-secondary); }

  .mini-chart-wrap {
    width: 180px;
    height: 60px;
    position: relative;
    flex-shrink: 0;
  }
  .mini-chart-wrap canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100% !important;
    height: 100% !important;
  }

  /* ── 중앙 차트 + 좌우 KPI 레이아웃 ── */
  .center-layout {
    display: grid;
    grid-template-columns: 210px 1fr 210px;
    gap: 14px;
    align-items: start;
    margin-bottom: 16px;
  }
  .kpi-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  /* 고객군 카드 그리드 (구형 — 미사용) */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .kpi-card {
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: var(--radius-md) var(--radius-md) 0 0;
  }
  .kpi-card.c-pairing::before { background: #5e8ce4; }
  .kpi-card.c-watch::before   { background: #85b0ee; }
  .kpi-card.c-buy::before     { background: #aac4f0; }
  .kpi-card.c-tid::before     { background: #c3d5f5; }
  .kpi-card.c-total {
    background: var(--surface);
    border-color: #0071e3;
    border-width: 1.5px;
  }
  .kpi-card.c-total::before { background: #0071e3; }
  .kpi-card.c-sub::before   { background: #dde8fb; }

  .kpi-card .c-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }
  .kpi-card .c-value {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text-primary);
    margin-bottom: 6px;
  }
  .kpi-card .c-value span { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-left: 2px; }

  .kpi-card .c-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .ratio-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    color: var(--text-secondary);
    background: rgba(0,0,0,0.05);
  }

  /* ── 차트 섹션 ── */
  .charts-col {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .chart-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 22px 24px;
    border: 1px solid var(--border);
  }
  .chart-card .chart-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 2px;
  }
  .chart-card .chart-sub {
    font-size: 10px;
    color: var(--text-tertiary);
    margin-bottom: 16px;
  }
  .chart-wrap {
    position: relative;
    height: 180px;
  }
  .chart-wrap canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100% !important;
    height: 100% !important;
  }

  /* ── 데이터 로딩 오버레이 ── */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    color: var(--text-tertiary);
    font-size: 13px;
    gap: 8px;
  }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dl-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 500;
    font-family: var(--font);
    color: var(--text-secondary);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .dl-btn:hover {
    background: var(--surface);
    color: var(--text-primary);
    border-color: rgba(0,0,0,0.15);
  }

  /* ── MAU 표 ── */
  .table-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    padding: 22px 24px;
    margin-top: 16px;
  }
  .table-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .table-scroll {
    overflow-x: auto;
    overflow-y: visible;
    -webkit-overflow-scrolling: touch;
  }
  .mau-table {
    width: max-content;
    min-width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    table-layout: auto;
  }
  .mau-table th {
    text-align: right;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 10px 14px 12px;
    background: #f5f5f7;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    letter-spacing: 0.01em;
  }
  .mau-table th:first-child {
    text-align: left;
    padding-left: 14px;
    border-radius: var(--radius-sm) 0 0 0;
    min-width: 90px;
  }
  .mau-table th:last-child {
    border-radius: 0 var(--radius-sm) 0 0;
  }
  .mau-table td {
    text-align: right;
    padding: 11px 14px;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    border-bottom: 1px solid rgba(0,0,0,0.04);
  }
  .mau-table td:first-child {
    text-align: left;
    padding-left: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    font-size: 12px;
  }
  /* 전체 MAU 행 강조 */
  .mau-table tr.row-total td {
    font-weight: 700;
    color: var(--text-primary);
    background: #f0f6ff;
    font-size: 13px;
  }
  .mau-table tr.row-total td:first-child {
    color: #0071e3;
    border-radius: var(--radius-sm) 0 0 var(--radius-sm);
  }
  .mau-table tr.row-total td:last-child {
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  /* 하위 행 들여쓰기 */
  .mau-table tr.row-seg td:first-child {
    padding-left: 24px;
    color: var(--text-secondary);
  }
  .mau-table tr.row-seg td {
    color: var(--text-secondary);
    font-size: 12px;
  }
  /* MoM 색상 */
  .cell-up   { color: #1a7f4b; }
  .cell-down { color: #c0392b; }
  .cell-flat { color: var(--text-tertiary); }

  /* ── 반응형 ── */
  @media (max-width: 1100px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .charts-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ── 사이드바 ── -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="app-name">앱 이용 현황</div>
    <div class="app-sub">B tv · 월별 지표</div>
  </div>

  <div class="nav-section">지표</div>

  <a class="nav-item active" onclick="navigate('mau')">
    <span class="nav-icon">📊</span> MAU
  </a>
  <a class="nav-item" onclick="navigate('tid')">

      <span id="sheet-link">Google Sheets 연결 전</span>

  </div>
</aside>

<!-- ── 메인 ── -->
<main class="main">

  <!-- 헤더 -->
  <div class="page-header">
    <div>
      <div class="page-title">MAU</div>
      <div class="page-sub">월간 활성 이용자 · 고객군별 현황</div>
    </div>
    <div class="month-selector">
      <span style="font-size:13px;color:var(--text-tertiary);">기준 월</span>
      <select id="month-select" onchange="renderPage()">
        <option value="">— 선택 —</option>
      </select>
    </div>
  </div>

  <!-- 상태 배너 -->
  <div id="status-banner"></div>

  <!-- KPI + 차트 3열 레이아웃 -->
  <div class="center-layout" id="center-layout">
    <!-- 좌측 KPI 컬럼 (로딩 플레이스홀더) -->
    <div class="kpi-col" id="kpi-left">
      <div class="loading" style="min-height:120px;"><div class="spinner"></div></div>
    </div>

    <!-- 중앙 차트 컬럼 -->
    <div class="charts-col">
      <div class="chart-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
          <div class="chart-title">MAU Trend</div>
          <button class="dl-btn" onclick="openTrendPopup()" style="font-size:11px;padding:4px 10px;">전체 기간 ↗</button>
        </div>
        <div class="chart-sub">최근 12개월</div>
        <div class="chart-wrap"><canvas id="trend-chart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">고객 Seg. 비중</div>
        <div class="chart-sub">전체 MAU 대비</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div>
            <div style="font-size:11px;font-weight:600;color:var(--text-tertiary);text-align:center;margin-bottom:6px;" id="ratio-label-this">해당 월</div>
            <div class="chart-wrap"><canvas id="ratio-chart"></canvas></div>
          </div>
          <div>
            <div style="font-size:11px;font-weight:600;color:var(--text-tertiary);text-align:center;margin-bottom:6px;" id="ratio-label-prev">전월</div>
            <div class="chart-wrap"><canvas id="ratio-chart-prev"></canvas></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 우측 KPI 컬럼 -->
    <div class="kpi-col" id="kpi-right">
      <div class="loading" style="min-height:120px;"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- MAU 월별 표 -->
  <div class="table-card" id="table-card">
    <div class="table-header">
      <div style="display:flex;align-items:baseline;gap:8px;">
        <div class="chart-title" style="font-weight:700;">MAU 상세 DATA</div>
        <div style="font-size:11px;color:var(--text-tertiary);font-weight:400;">고객군별 이용자 수</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="dl-btn" onclick="downloadExcel()">⬇ 엑셀</button>
        <button class="dl-btn" onclick="downloadImage()">🖼 이미지</button>
      </div>
    </div>
    <div class="table-scroll">
      <table class="mau-table" id="mau-table">
        <thead><tr id="table-head"></tr></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">
      <p style="font-size:11px;color:var(--text-tertiary);line-height:1.6;">
        * 모바일 B tv MAU: PCID 기준으로 추출된 UV
      </p>
    </div>
  </div>

</main>

<!-- 전체 기간 팝업 -->
<div id="trend-popup" style="display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.45);align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:20px;padding:28px 32px;width:min(90vw,860px);box-shadow:0 24px 60px rgba(0,0,0,0.18);">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div>
        <div style="font-size:15px;font-weight:700;color:#1d1d1f;">MAU Trend — 전체 기간</div>
        <div style="font-size:11px;color:#aeaeb2;margin-top:2px;">전체 데이터 기준</div>
      </div>
      <button onclick="closeTrendPopup()" style="font-size:18px;background:none;border:none;cursor:pointer;color:#6e6e73;line-height:1;">✕</button>
    </div>
    <div style="position:relative;height:320px;">
      <canvas id="trend-chart-full"></canvas>
    </div>
  </div>
</div>

// ══════════════════════════════════════════════
// 파싱된 데이터 저장소
// ══════════════════════════════════════════════
let allData = [];
let months = [];
let trendChart    = null;
let ratioChart    = null;
let ratioChartPrev = null;
let miniChart     = null;

// ══════════════════════════════════════════════
// 구글 시트 CSV 로드
// ══════════════════════════════════════════════
async function loadData() {
  if (SHEET_ID === 'YOUR_SHEET_ID_HERE') {
    useSampleData();
    return;
  }

  // export 방식 — 탭 구분 TSV로 받아서 인코딩 문제 우회
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}&t=${Date.now()}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    console.log('[원본 첫 3줄]', text.split('\n').slice(0,3));

    if (text.includes('accounts.google.com')) {
      throw new Error('시트가 비공개 상태입니다. 공유 설정을 확인해주세요.');
    }

    parseCSV(text);
    document.getElementById('sheet-link').textContent = 'Google Sheets ✓';

  } catch(e) {
    console.error('[시트 연결 오류]', e.message);
    showBanner(`⚠ 연결 실패: ${e.message}`, 'warn');
    useSampleData();
  }
}

function parseTSV(text) {
  const lines = text.trim().split('\n');
  console.log('[TSV 첫 3줄]', lines.slice(0, 3));

  allData = [];
  lines.forEach(line => {
    if (!line.trim()) return;
    const cols = line.split('\t').map(c => c.trim().replace(/^"|"$/g, ''));
    const dateCode = cols[0];
    const segment  = cols[1];
    const uv       = parseInt((cols[2] || '').replace(/,/g, ''), 10);
    if (dateCode && segment && !isNaN(uv)) {
      allData.push({ dateCode, segment, uv });
    }
  });

  console.log(`[파싱 완료] ${allData.length}건`);

  if (allData.length === 0) {
    throw new Error('파싱된 데이터가 없습니다. 구조를 확인해주세요.');
  }

  buildMonthList();
  initMonthSelect();
  renderPage();
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  console.log('[CSV 원본 첫 3줄]', lines.slice(0, 3));

  // 첫 행이 헤더인지 확인 (숫자로 시작하지 않으면 헤더로 간주해 스킵)
  const startIdx = isNaN(lines[0]?.split(',')[0]?.replace(/"/g,'').trim()) ? 1 : 0;
  const rows = lines.slice(startIdx);

  allData = [];
  rows.forEach((row, i) => {
    // 따옴표 안의 쉼표 처리
    const cols = row.match(/(".*?"|[^,]+)(?=,|$)/g)
      ?.map(c => c.replace(/^"|"$/g,'').trim()) || [];
    const dateCode = cols[0];
    const segment  = cols[1];
    const uv       = parseInt((cols[2] || '').replace(/,/g,''), 10);
    if (dateCode && segment && !isNaN(uv)) {
      allData.push({ dateCode, segment, uv });
    }
  });

  console.log(`[파싱 완료] ${allData.length}건`);

  if (allData.length === 0) {
    throw new Error('파싱된 데이터가 없습니다. 컬럼 구조를 확인해주세요.');
  }

  buildMonthList();
  initMonthSelect();
  renderPage();
}

function useSampleData() {
  allData = SAMPLE.map(([dateCode, segment, uv]) => ({ dateCode, segment, uv }));
  showBanner('📋 샘플 데이터 미리보기 — SHEET_ID를 입력하면 실제 데이터로 연결됩니다.', 'info');
  buildMonthList();
  initMonthSelect();
  renderPage();
}

function buildMonthList() {
  const set = new Set(allData.map(d => d.dateCode));
  months = [...set].sort();
}

function initMonthSelect() {
  const sel = document.getElementById('month-select');
  sel.innerHTML = '';
  months.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = formatMonth(m);
    sel.appendChild(opt);
  });
  // 최신 월 기본 선택
  sel.value = months[months.length - 1];
}

// ══════════════════════════════════════════════
// 렌더링
// ══════════════════════════════════════════════
function renderPage() {
  const selMonth = document.getElementById('month-select').value;
  if (!selMonth) return;

  const prevMonth = months[months.indexOf(selMonth) - 1] || null;

  // 이번 달 데이터
  const thisMonthData = getMonthData(selMonth);
  const prevMonthData = prevMonth ? getMonthData(prevMonth) : null;

  const totalUV = thisMonthData[TOTAL_KEY] || 0;
  const prevTotalUV = prevMonthData ? (prevMonthData[TOTAL_KEY] || 0) : 0;

  // 고객군 KPI 카드 (전체 포함) — 미니차트 canvas도 여기서 삽입됨
  renderKPIGrid(thisMonthData, prevMonthData, totalUV, prevTotalUV);

  // 미니 바 차트 (canvas가 DOM에 추가된 뒤 실행)
  renderMiniChart();

  // 추이 차트
  renderTrendChart();

  // 비율 도넛 (해당월 + 전월)
  renderRatioChart(thisMonthData, totalUV, prevMonthData, prevTotalUV, selMonth, prevMonth);

  // 월별 MAU 표
  renderMAUTable();
}

function getMonthData(dateCode) {
  const rows = allData.filter(d => d.dateCode === dateCode);
  const map = {};
  rows.forEach(r => { map[r.segment] = r.uv; });
  return map;
}

function renderKPIGrid(thisData, prevData, totalUV, prevTotalUV) {
  // 좌: 전체(메인) + 페어링 + 시청  /  우: 구매 + T아이디 + 월정액
  const leftSegs  = SEGMENTS.slice(0, 2);   // 페어링, 시청
  const rightSegs = SEGMENTS.slice(2);       // 구매, T아이디, 월정액

  function makeSegCard(seg) {
    const val   = thisData[seg.key]  || 0;
    const prev  = prevData ? (prevData[seg.key] || 0) : 0;
    const ratio = totalUV > 0 ? ((val / totalUV) * 100).toFixed(1) : '—';
    const card  = document.createElement('div');
    card.className = `kpi-card ${seg.cls}`;
    card.innerHTML = `
      <div class="c-label">${seg.label}</div>
      <div class="c-value">${fmt(val)}<span>명</span></div>
      <div class="c-meta">
        ${momBadge(val, prev)}
        <span class="ratio-pill">${ratio}%</span>
      </div>
    `;
    return card;
  }

  // 전체 MAU 메인 카드 (좌측 1번)
  function makeTotalCard() {
    const card = document.createElement('div');
    card.className = 'kpi-card c-total';
    card.innerHTML = `
      <div class="c-label" style="color:var(--text-tertiary);">MAU</div>
      <div class="c-value" style="color:var(--text-primary);font-size:26px;">${fmt(totalUV)}<span style="color:var(--text-secondary);">명</span></div>
      <div class="c-meta" style="margin-bottom:10px;">
        ${momBadge(totalUV, prevTotalUV)}
        <span style="font-size:11px;color:var(--text-tertiary);">기준 월</span>
      </div>
      <div class="mini-chart-wrap"><canvas id="mini-chart"></canvas></div>
    `;
    return card;
  }

  const leftCol  = document.getElementById('kpi-left');
  const rightCol = document.getElementById('kpi-right');
  leftCol.innerHTML  = '';
  rightCol.innerHTML = '';

  leftCol.appendChild(makeTotalCard());
  leftSegs.forEach(seg  => leftCol.appendChild(makeSegCard(seg)));
  rightSegs.forEach(seg => rightCol.appendChild(makeSegCard(seg)));
}

function renderMiniChart() {
  const recent = months.slice(-6);
  const labels = recent.map(m => formatMonth(m, true));
  const values = recent.map(m => {
    const d = getMonthData(m);
    return (d[TOTAL_KEY] || 0) / 10000;
  });

  if (miniChart) miniChart.destroy();
  const ctx = document.getElementById('mini-chart').getContext('2d');
  miniChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: values.map((_, i) => i === values.length - 1 ? TOTAL_COLOR : '#d1e5fa'),
        borderRadius: 4,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => `${ctx.parsed.y.toFixed(1)}만명` }
      }},
      scales: {
        x: { display: false },
        y: { display: false, beginAtZero: false }
      }
    }
  });
}

function buildTrendDatasets(targetMonths) {
  const labels = targetMonths.map(m => {
    const y = m.slice(0,4), mo = parseInt(m.slice(4,6),10);
    return `${y.slice(2)}년 ${mo}월`;
  });
  const datasets = [
    {
      label: '전체',
      data: targetMonths.map(m => (getMonthData(m)[TOTAL_KEY] || 0) / 10000),
      borderColor: TOTAL_COLOR,
      backgroundColor: 'transparent',
      borderWidth: 2.5,
      pointRadius: 3.5,
      pointBackgroundColor: TOTAL_COLOR,
      tension: 0.35,
    },
    ...SEGMENTS.map(seg => ({
      label: seg.label,
      data: targetMonths.map(m => (getMonthData(m)[seg.key] || 0) / 10000),
      borderColor: seg.color,
      backgroundColor: 'transparent',
      borderWidth: 1.5,
      pointRadius: 2.5,
      pointBackgroundColor: seg.color,
      tension: 0.35,
    }))
  ];
  return { labels, datasets };
}

function trendChartOptions() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: {
        position: 'bottom',
        labels: { font: { size: 11, family: '-apple-system' }, boxWidth: 12, padding: 16, usePointStyle: true }
      },
      tooltip: {
        backgroundColor: 'rgba(255,255,255,0.95)',
        titleColor: '#1d1d1f',
        bodyColor: '#6e6e73',
        borderColor: 'rgba(0,0,0,0.08)',
        borderWidth: 1,
        padding: 10,
        callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)}만명` }
      }
    },
    scales: {
      x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#aeaeb2' } },
      y: { grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { font: { size: 11 }, color: '#aeaeb2', callback: v => v + '만' } }
    }
  };
}

function renderTrendChart() {
  // 최근 12개월만
  const recent12 = months.slice(-12);
  const { labels, datasets } = buildTrendDatasets(recent12);

  if (trendChart) trendChart.destroy();
  const ctx = document.getElementById('trend-chart').getContext('2d');
  trendChart = new Chart(ctx, { type: 'line', data: { labels, datasets }, options: trendChartOptions() });
}

let trendFullChart = null;

function openTrendPopup() {
  const popup = document.getElementById('trend-popup');
  popup.style.display = 'flex';

  const { labels, datasets } = buildTrendDatasets(months);
  if (trendFullChart) trendFullChart.destroy();
  const ctx = document.getElementById('trend-chart-full').getContext('2d');
  trendFullChart = new Chart(ctx, { type: 'line', data: { labels, datasets }, options: trendChartOptions() });
}

function closeTrendPopup() {
  document.getElementById('trend-popup').style.display = 'none';
  if (trendFullChart) { trendFullChart.destroy(); trendFullChart = null; }
}

function renderRatioChart(thisData, totalUV, prevData, prevTotalUV, selMonth, prevMonth) {
  const labels = SEGMENTS.map(s => s.label);
  const colors  = SEGMENTS.map(s => s.color);

  // 라벨 월명 업데이트
  document.getElementById('ratio-label-this').textContent = selMonth ? formatMonth(selMonth) : '해당 월';
  document.getElementById('ratio-label-prev').textContent = prevMonth ? formatMonth(prevMonth) : '전월';

  function makeDoughnutConfig(data, total) {
    const values = SEGMENTS.map(s => data ? (data[s.key] || 0) : 0);
    return {
      type: 'doughnut',
      data: {
        labels,
        datasets: [{ data: values, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '65%',
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              font: { size: 10, family: '-apple-system' },
              boxWidth: 8, padding: 8,
              usePointStyle: true,
              generateLabels: chart => {
                return chart.data.labels.map((lbl, i) => {
                  const val = chart.data.datasets[0].data[i];
                  const pct = total > 0 ? ((val / total) * 100).toFixed(1) : '0';
                  return { text: `${lbl} ${pct}%`, fillStyle: colors[i], hidden: false, index: i };
                });
              }
            }
          },
          tooltip: {
            backgroundColor: 'rgba(255,255,255,0.95)',
            titleColor: '#1d1d1f',
            bodyColor: '#6e6e73',
            borderColor: 'rgba(0,0,0,0.08)',
            borderWidth: 1,
            callbacks: {
              label: ctx => {
                const val = ctx.parsed;
                const pct = total > 0 ? ((val / total) * 100).toFixed(1) : '0';
                return ` ${fmt(val)}명 (${pct}%)`;
              }
            }
          }
        }
      }
    };
  }

  // 해당 월
  if (ratioChart) ratioChart.destroy();
  ratioChart = new Chart(
    document.getElementById('ratio-chart').getContext('2d'),
    makeDoughnutConfig(thisData, totalUV)
  );

  // 전월
  if (ratioChartPrev) ratioChartPrev.destroy();
  ratioChartPrev = new Chart(
    document.getElementById('ratio-chart-prev').getContext('2d'),
    makeDoughnutConfig(prevData, prevTotalUV)
  );
}

function renderMAUTable() {
  const selMonth = document.getElementById('month-select').value;

  const TABLE_ROWS = [
    { key: TOTAL_KEY,         label: 'MAU',    isTotal: true },
    { key: '10_Btv연결',      label: '페어링', isTotal: false },
    { key: '09_T아이디연결',  label: 'T아이디',isTotal: false },
    { key: '02_월정액고객',   label: '월정액', isTotal: false },
    { key: '11_시청고객',     label: '시청',   isTotal: false },
    { key: '08_VOD구매',      label: '구매',   isTotal: false },
  ];

  // 헤더: 해당 월 파란색 강조
  const thead = document.getElementById('table-head');
  thead.innerHTML = `<th>고객군</th>` +
    months.map(m => {
      const y  = m.slice(0,4);
      const mo = parseInt(m.slice(4,6), 10);
      const isSelected = m === selMonth;
      const style = isSelected
        ? 'background:#0071e3;color:#fff;border-bottom:2px solid #0071e3;'
        : '';
      const id = isSelected ? 'th-selected' : '';
      return `<th ${id ? `id="${id}"` : ''} style="${style}">${y.slice(2)}년 ${mo}월</th>`;
    }).join('');

  // 본문
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  TABLE_ROWS.forEach(row => {
    const tr = document.createElement('tr');
    tr.className = row.isTotal ? 'row-total' : 'row-seg';

    let labelCell = `<td>${row.isTotal ? '' : '　'}${row.label}</td>`;

    const cells = months.map((m, i) => {
      const cur  = (getMonthData(m)[row.key] || 0);
      const prev = i > 0 ? (getMonthData(months[i-1])[row.key] || 0) : null;
      const isSelected = m === selMonth;

      const valStr = cur >= 10000
        ? (cur / 10000).toFixed(1) + '만'
        : cur.toLocaleString();

      let momStr = '';
      if (prev !== null && prev > 0) {
        const diff = cur - prev;
        const pct  = ((diff / prev) * 100).toFixed(1);
        if (diff > 0)      momStr = `<span class="cell-up">▲${pct}%</span>`;
        else if (diff < 0) momStr = `<span class="cell-down">▼${Math.abs(pct)}%</span>`;
        else               momStr = `<span class="cell-flat">—</span>`;
      }

      const cellStyle = isSelected
        ? 'style="background:#f0f6ff;font-weight:600;color:#0071e3;"'
        : '';

      return `<td ${cellStyle}>${valStr}${momStr ? `<br><span style="font-size:10px;">${momStr}</span>` : ''}</td>`;
    }).join('');

    tr.innerHTML = labelCell + cells;
    tbody.appendChild(tr);
  });

  // 해당 월 컬럼으로 자동 스크롤
  requestAnimationFrame(() => {
    const thSelected = document.getElementById('th-selected');
    const scrollWrap = document.querySelector('.table-scroll');
    if (thSelected && scrollWrap) {
      const thLeft    = thSelected.offsetLeft;
      const thWidth   = thSelected.offsetWidth;
      const wrapWidth = scrollWrap.offsetWidth;
      scrollWrap.scrollLeft = thLeft - wrapWidth / 2 + thWidth / 2;
    }
  });
}

// ══════════════════════════════════════════════
// 유틸
// ══════════════════════════════════════════════
function fmt(n) {
  return n >= 10000
    ? (n / 10000).toFixed(1) + '만'
    : n.toLocaleString();
}

function formatMonth(code, short = false) {
  const y = code.slice(0,4);
  const m = parseInt(code.slice(4,6), 10);
  return short ? `${m}월` : `${y}년 ${m}월`;
}

function momBadgeDark(cur, prev) {
  if (!prev) return '<span style="font-size:12px;color:rgba(255,255,255,0.5);">—</span>';
  const diff = cur - prev;
  const pct  = prev > 0 ? ((diff / prev) * 100).toFixed(1) : '0';
  const style = 'display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;margin-top:8px;';
  if (diff > 0) return `<span style="${style}background:rgba(255,255,255,0.2);color:#fff;">▲ ${pct}%</span>`;
  if (diff < 0) return `<span style="${style}background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.8);">▼ ${Math.abs(pct)}%</span>`;
  return `<span style="${style}background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);">— 0%</span>`;
}

function momBadge(cur, prev) {
  if (!prev) return '<span class="mom-badge flat">—</span>';
  const diff = cur - prev;
  const pct  = prev > 0 ? ((diff / prev) * 100).toFixed(1) : '0';
  if (diff > 0) return `<span class="mom-badge up">▲ ${pct}%</span>`;
  if (diff < 0) return `<span class="mom-badge down">▼ ${Math.abs(pct)}%</span>`;
  return '<span class="mom-badge flat">— 0%</span>';
}

function showBanner(msg, type) {
  const b = document.getElementById('status-banner');
  b.textContent = msg;
  b.style.display = 'flex';
  b.style.background = type === 'warn' ? '#fff8e7' : '#e8f1fb';
  b.style.borderColor = type === 'warn' ? '#f0c840' : '#90bff0';
  b.style.color       = type === 'warn' ? '#856404' : '#0c4a8f';
}

function navigate(page) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  // 추후 T아이디·페어링 탭 추가 시 여기서 전환
  if (page !== 'mau') {
    alert(`"${page}" 탭은 준비 중입니다.`);
  }
}

// ══════════════════════════════════════════════
// 다운로드
// ══════════════════════════════════════════════
function downloadExcel() {
  const TABLE_ROWS = [
    { key: TOTAL_KEY,          label: 'MAU' },
    { key: '10_Btv연결',       label: '페어링' },
    { key: '09_T아이디연결',   label: 'T아이디' },
    { key: '02_월정액고객',    label: '월정액' },
    { key: '11_시청고객',      label: '시청' },
    { key: '08_VOD구매',       label: '구매' },
  ];

  // 헤더 행
  const header = ['고객군', ...months.map(m => {
    const y = m.slice(0,4), mo = parseInt(m.slice(4,6),10);
    return `${y}년 ${mo}월`;
  })];

  // 데이터 행
  const rows = TABLE_ROWS.map(row => {
    const vals = months.map(m => getMonthData(m)[row.key] || 0);
    return [row.label, ...vals];
  });

  // CSV 생성 (BOM 포함 → 엑셀 한글 깨짐 방지)
  const csv = [header, ...rows].map(r => r.join(',')).join('\n');
  const bom = '\uFEFF';
  const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `MAU_상세DATA_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

async function downloadImage() {
  // html2canvas 동적 로드
  if (!window.html2canvas) {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    document.head.appendChild(script);
    await new Promise(res => script.onload = res);
  }
  const card = document.getElementById('table-card');
  const canvas = await html2canvas(card, { scale: 2, backgroundColor: '#ffffff' });
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = `MAU_상세DATA_${new Date().toISOString().slice(0,10)}.png`;
  a.click();
}

document.getElementById('trend-popup').addEventListener('click', function(e) {
  if (e.target === this) closeTrendPopup();
});
