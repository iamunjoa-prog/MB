<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>앱 이용 현황</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sidebar-w: 200px;
    --bg: #f5f5f7;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.08);
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #aeaeb2;
    --accent: #0071e3;
    --accent-light: #e8f1fb;
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 18px;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
  }

  /* ── 사이드바 ── */
  .sidebar {
    width: var(--sidebar-w);
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0;
    z-index: 100;
  }

  .sidebar-logo {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo .app-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.3px;
  }
  .sidebar-logo .app-sub {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 2px;
  }

  .nav-section {
    padding: 16px 12px 8px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-tertiary);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 12px;
    margin: 2px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: background 0.15s, color 0.15s;
    text-decoration: none;
  }
  .nav-item:hover { background: var(--bg); color: var(--text-primary); }
  .nav-item.active { background: var(--accent-light); color: var(--accent); }

  .nav-icon {
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .sidebar-footer {
    margin-top: auto;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
  }
  .data-source {
    font-size: 10px;
    color: var(--text-tertiary);
    line-height: 1.5;
  }
  .data-source span { color: var(--accent); font-weight: 500; }

  /* ── 메인 ── */
  .main {
    margin-left: var(--sidebar-w);
    flex: 1;
    min-height: 100vh;
    padding: 32px 36px;
  }

  .page-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .page-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text-primary);
  }
  .page-sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .month-selector {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
  }
  .month-selector select {
    font-size: 13px;
    font-family: var(--font);
    font-weight: 500;
    color: var(--text-primary);
    border: none;
    background: transparent;
    outline: none;
    cursor: pointer;
  }

  /* ── 상태 배너 ── */
  #status-banner {
    background: #fff8e7;
    border: 1px solid #f0c840;
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    font-size: 12px;
    color: #856404;
    margin-bottom: 20px;
    display: none;
    align-items: center;
    gap: 8px;
  }

  /* ── KPI 카드 ── */
  .kpi-section { margin-bottom: 28px; }
  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* 전체 MAU 카드 */
  .kpi-total {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 24px 28px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid var(--border);
  }
  .kpi-total-left .label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .kpi-total-left .value {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--text-primary);
  }
  .kpi-total-left .value span { font-size: 18px; font-weight: 500; margin-left: 4px; color: var(--text-secondary); }
  .mom-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    margin-top: 8px;
  }
  .mom-badge.up { background: #e8faf0; color: #1a7f4b; }
  .mom-badge.down { background: #fde8e8; color: #c0392b; }
  .mom-badge.flat { background: var(--bg); color: var(--text-secondary); }

  .mini-chart-wrap {
    width: 180px;
    height: 60px;
    position: relative;
    flex-shrink: 0;
  }
  .mini-chart-wrap canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100% !important;
    height: 100% !important;
  }

  /* ── 중앙 차트 + 좌우 KPI 레이아웃 ── */
  .center-layout {
    display: grid;
    grid-template-columns: 210px 1fr 210px;
    gap: 14px;
    align-items: start;
    margin-bottom: 16px;
  }
  .kpi-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  /* 고객군 카드 그리드 (구형 — 미사용) */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .kpi-card {
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: var(--radius-md) var(--radius-md) 0 0;
  }
  .kpi-card.c-pairing::before { background: #5e8ce4; }
  .kpi-card.c-watch::before   { background: #85b0ee; }
  .kpi-card.c-buy::before     { background: #aac4f0; }
  .kpi-card.c-tid::before     { background: #c3d5f5; }
  .kpi-card.c-total {
    background: var(--surface);
    border-color: #0071e3;
    border-width: 1.5px;
  }
  .kpi-card.c-total::before { background: #0071e3; }
  .kpi-card.c-sub::before   { background: #dde8fb; }

  .kpi-card .c-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }
  .kpi-card .c-value {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text-primary);
    margin-bottom: 6px;
  }
  .kpi-card .c-value span { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-left: 2px; }

  .kpi-card .c-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .ratio-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    color: var(--text-secondary);
    background: rgba(0,0,0,0.05);
  }

  /* ── 차트 섹션 ── */
  .charts-col {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .chart-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 22px 24px;
    border: 1px solid var(--border);
  }
  .chart-card .chart-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 2px;
  }
  .chart-card .chart-sub {
    font-size: 10px;
    color: var(--text-tertiary);
    margin-bottom: 16px;
  }
  .chart-wrap {
    position: relative;
    height: 180px;
  }
  .chart-wrap canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100% !important;
    height: 100% !important;
  }

  /* ── 데이터 로딩 오버레이 ── */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    color: var(--text-tertiary);
    font-size: 13px;
    gap: 8px;
  }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── MAU 표 ── */
  .table-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    padding: 22px 24px;
    margin-top: 16px;
  }
  .table-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .table-scroll {
    overflow-x: auto;
  }
  .mau-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    table-layout: auto;
  }
  .mau-table th {
    text-align: right;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 10px 14px 12px;
    background: #f5f5f7;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    letter-spacing: 0.01em;
  }
  .mau-table th:first-child {
    text-align: left;
    padding-left: 14px;
    border-radius: var(--radius-sm) 0 0 0;
    min-width: 90px;
  }
  .mau-table th:last-child {
    border-radius: 0 var(--radius-sm) 0 0;
  }
  .mau-table td {
    text-align: right;
    padding: 11px 14px;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    border-bottom: 1px solid rgba(0,0,0,0.04);
  }
  .mau-table td:first-child {
    text-align: left;
    padding-left: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    font-size: 12px;
  }
  /* 전체 MAU 행 강조 */
  .mau-table tr.row-total td {
    font-weight: 700;
    color: var(--text-primary);
    background: #f0f6ff;
    font-size: 13px;
  }
  .mau-table tr.row-total td:first-child {
    color: #0071e3;
    border-radius: var(--radius-sm) 0 0 var(--radius-sm);
  }
  .mau-table tr.row-total td:last-child {
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  /* 하위 행 들여쓰기 */
  .mau-table tr.row-seg td:first-child {
    padding-left: 14px;
    color: var(--text-secondary);
  }
  .mau-table tr.row-seg td {
    color: var(--text-secondary);
    font-size: 12px;
  }
  /* MoM 색상 */
  .cell-up   { color: #1a7f4b; }
  .cell-down { color: #c0392b; }
  .cell-flat { color: var(--text-tertiary); }

  /* ── 반응형 ── */
  @media (max-width: 1100px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .charts-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ── 사이드바 ── -->
<aside class="sidebar">

<!-- ── 메인 ── -->
<main class="main">

  <!-- MAU 월별 표 -->
  <div class="table-card">
    <div class="table-header">
      <div>
        <div class="chart-title">월별 MAU</div>
        <div class="chart-sub">고객군별 이용자 수</div>

      <table class="mau-table" id="mau-table">
        <thead><tr id="table-head"></tr></thead>

      </table>

  </div>

</main>

<script>
// ══════════════════════════════════════════════
// ① 설정: 구글 시트 ID를 여기에 입력하세요
// ══════════════════════════════════════════════
const SHEET_ID = '1eDv5l59RnYDvibgBVnnaSAFi6dOol7FFJqJD95PcSEY';   // ← 여기에 시트 ID
const SHEET_TAB = 'UV';                  // 탭 이름

// ══════════════════════════════════════════════
// ② 고객군 정의 (B열 값 → 표시명 + 스타일)
// ══════════════════════════════════════════════
const SEGMENTS = [
  { key: '10_Btv연결',    label: '페어링',   cls: 'c-pairing', color: '#5e8ce4' },
  { key: '11_시청고객',   label: '시청',     cls: 'c-watch',   color: '#85b0ee' },
  { key: '08_VOD구매',    label: '구매',     cls: 'c-buy',     color: '#aac4f0' },
  { key: '09_T아이디연결',label: 'T아이디',  cls: 'c-tid',     color: '#c3d5f5' },
  { key: '02_월정액고객', label: '월정액',   cls: 'c-sub',     color: '#dde8fb' },
];
const TOTAL_COLOR = '#0071e3';   // 전체 MAU 포인트 컬러
const TOTAL_KEY = '00_전체';

// ══════════════════════════════════════════════
// 샘플 데이터 (시트 연결 전 미리보기용)
// ══════════════════════════════════════════════
const SAMPLE = [
  // [날짜코드, 고객군, UV]
  ['20240930','00_전체',4820000],['20240930','10_Btv연결',1850000],['20240930','11_시청고객',2310000],['20240930','08_VOD구매',680000],['20240930','09_T아이디연결',1420000],['20240930','02_월정액고객',2100000],
  ['20241031','00_전체',4960000],['20241031','10_Btv연결',1920000],['20241031','11_시청고객',2380000],['20241031','08_VOD구매',710000],['20241031','09_T아이디연결',1470000],['20241031','02_월정액고객',2160000],
  ['20241130','00_전체',5140000],['20241130','10_Btv연결',1990000],['20241130','11_시청고객',2450000],['20241130','08_VOD구매',740000],['20241130','09_T아이디연결',1520000],['20241130','02_월정액고객',2230000],
  ['20241231','00_전체',5380000],['20241231','10_Btv연결',2080000],['20241231','11_시청고객',2560000],['20241231','08_VOD구매',780000],['20241231','09_T아이디연결',1590000],['20241231','02_월정액고객',2320000],
  ['20250131','00_전체',5210000],['20250131','10_Btv연결',2010000],['20250131','11_시청고객',2490000],['20250131','08_VOD구매',760000],['20250131','09_T아이디연결',1550000],['20250131','02_월정액고객',2260000],
  ['20250228','00_전체',5320000],['20250228','10_Btv연결',2060000],['20250228','11_시청고객',2540000],['20250228','08_VOD구매',775000],['20250228','09_T아이디연결',1580000],['20250228','02_월정액고객',2300000],
  ['20250331','00_전체',5480000],['20250331','10_Btv연결',2130000],['20250331','11_시청고객',2610000],['20250331','08_VOD구매',800000],['20250331','09_T아이디연결',1630000],['20250331','02_월정액고객',2360000],
  ['20250430','00_전체',5390000],['20250430','10_Btv연결',2090000],['20250430','11_시청고객',2580000],['20250430','08_VOD구매',790000],['20250430','09_T아이디연결',1610000],['20250430','02_월정액고객',2340000],
  ['20250531','00_전체',5560000],['20250531','10_Btv연결',2180000],['20250531','11_시청고객',2650000],['20250531','08_VOD구매',820000],['20250531','09_T아이디연결',1660000],['20250531','02_월정액고객',2410000],
];

// ══════════════════════════════════════════════
// 파싱된 데이터 저장소
// ══════════════════════════════════════════════
let allData = [];   // { dateCode, segment, uv }
let months = [];    // 정렬된 날짜코드 배열
let trendChart = null;
let ratioChart  = null;
let miniChart   = null;

// ══════════════════════════════════════════════
// 구글 시트 CSV 로드
// ══════════════════════════════════════════════
async function loadData() {
  if (SHEET_ID === '1eDv5l59RnYDvibgBVnnaSAFi6dOol7FFJqJD95PcSEY') {
    useSampleData();
    return;
  }

  // gviz 방식 (공유 시트에서 가장 안정적)
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();

    // 로그인 페이지로 리다이렉트된 경우 (시트 비공개)
    if (text.includes('accounts.google.com') || text.includes('signin')) {
      throw new Error('시트가 비공개 상태입니다. 공유 설정을 확인해주세요.');
    }
    // 응답이 너무 짧으면 데이터 없음
    if (text.trim().length < 10) {
      throw new Error('데이터가 비어있거나 탭명이 다릅니다.');
    }

    parseCSV(text);
    document.getElementById('sheet-link').textContent = 'Google Sheets ✓';

  } catch(e) {
    console.error('[시트 연결 오류]', e.message);
    showBanner(`⚠ 연결 실패: ${e.message}`, 'warn');
    useSampleData();
  }
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  console.log('[CSV 원본 첫 3줄]', lines.slice(0, 3));

  // 첫 행이 헤더인지 확인 (숫자로 시작하지 않으면 헤더로 간주해 스킵)
  const startIdx = isNaN(lines[0]?.split(',')[0]?.replace(/"/g,'').trim()) ? 1 : 0;
  const rows = lines.slice(startIdx);

  allData = [];
  rows.forEach((row, i) => {
    // 따옴표 안의 쉼표 처리
    const cols = row.match(/(".*?"|[^,]+)(?=,|$)/g)
      ?.map(c => c.replace(/^"|"$/g,'').trim()) || [];
    const dateCode = cols[0];
    const segment  = cols[1];
    const uv       = parseInt((cols[2] || '').replace(/,/g,''), 10);
    if (dateCode && segment && !isNaN(uv)) {
      allData.push({ dateCode, segment, uv });
    }
  });

  console.log(`[파싱 완료] ${allData.length}건`);

  if (allData.length === 0) {
    throw new Error('파싱된 데이터가 없습니다. 컬럼 구조를 확인해주세요.');
  }

  buildMonthList();
  initMonthSelect();
  renderPage();
}

function useSampleData() {
  allData = SAMPLE.map(([dateCode, segment, uv]) => ({ dateCode, segment, uv }));
  showBanner('📋 샘플 데이터 미리보기 — SHEET_ID를 입력하면 실제 데이터로 연결됩니다.', 'info');
  buildMonthList();
  initMonthSelect();
  renderPage();
}

function buildMonthList() {
  const set = new Set(allData.map(d => d.dateCode));
  months = [...set].sort();
}

function initMonthSelect() {
  const sel = document.getElementById('month-select');
  sel.innerHTML = '';
  months.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = formatMonth(m);
    sel.appendChild(opt);
  });
  // 최신 월 기본 선택
  sel.value = months[months.length - 1];
}

// ══════════════════════════════════════════════
// 렌더링
// ══════════════════════════════════════════════
function renderPage() {
  const selMonth = document.getElementById('month-select').value;
  if (!selMonth) return;

  const prevMonth = months[months.indexOf(selMonth) - 1] || null;

  // 이번 달 데이터
  const thisMonthData = getMonthData(selMonth);
  const prevMonthData = prevMonth ? getMonthData(prevMonth) : null;

  const totalUV = thisMonthData[TOTAL_KEY] || 0;
  const prevTotalUV = prevMonthData ? (prevMonthData[TOTAL_KEY] || 0) : 0;

  // 고객군 KPI 카드 (전체 포함) — 미니차트 canvas도 여기서 삽입됨
  renderKPIGrid(thisMonthData, prevMonthData, totalUV, prevTotalUV);

  // 미니 바 차트 (canvas가 DOM에 추가된 뒤 실행)
  renderMiniChart();

  // 추이 차트
  renderTrendChart();

  // 비율 도넛
  renderRatioChart(thisMonthData, totalUV);

  // 월별 MAU 표
  renderMAUTable();
}

function getMonthData(dateCode) {
  const rows = allData.filter(d => d.dateCode === dateCode);
  const map = {};
  rows.forEach(r => { map[r.segment] = r.uv; });
  return map;
}

function renderKPIGrid(thisData, prevData, totalUV, prevTotalUV) {
  // 좌: 전체(메인) + 페어링 + 시청  /  우: 구매 + T아이디 + 월정액
  const leftSegs  = SEGMENTS.slice(0, 2);   // 페어링, 시청
  const rightSegs = SEGMENTS.slice(2);       // 구매, T아이디, 월정액

  function makeSegCard(seg) {
    const val   = thisData[seg.key]  || 0;
    const prev  = prevData ? (prevData[seg.key] || 0) : 0;
    const ratio = totalUV > 0 ? ((val / totalUV) * 100).toFixed(1) : '—';
    const card  = document.createElement('div');
    card.className = `kpi-card ${seg.cls}`;
    card.innerHTML = `
      <div class="c-label">${seg.label}</div>
      <div class="c-value">${fmt(val)}<span>명</span></div>
      <div class="c-meta">
        ${momBadge(val, prev)}
        <span class="ratio-pill">${ratio}%</span>
      </div>
    `;
    return card;
  }

  // 전체 MAU 메인 카드 (좌측 1번)
  function makeTotalCard() {
    const card = document.createElement('div');
    card.className = 'kpi-card c-total';
    card.innerHTML = `
      <div class="c-label" style="color:var(--text-tertiary);">전체 MAU</div>
      <div class="c-value" style="color:var(--text-primary);font-size:26px;">${fmt(totalUV)}<span style="color:var(--text-secondary);">명</span></div>
      <div class="c-meta" style="margin-bottom:10px;">
        ${momBadge(totalUV, prevTotalUV)}
        <span style="font-size:11px;color:var(--text-tertiary);">기준 월</span>
      </div>
      <div class="mini-chart-wrap"><canvas id="mini-chart"></canvas></div>
    `;
    return card;
  }

  const leftCol  = document.getElementById('kpi-left');
  const rightCol = document.getElementById('kpi-right');
  leftCol.innerHTML  = '';
  rightCol.innerHTML = '';

  leftCol.appendChild(makeTotalCard());
  leftSegs.forEach(seg  => leftCol.appendChild(makeSegCard(seg)));
  rightSegs.forEach(seg => rightCol.appendChild(makeSegCard(seg)));
}

function renderMiniChart() {
  const recent = months.slice(-6);
  const labels = recent.map(m => formatMonth(m, true));
  const values = recent.map(m => {
    const d = getMonthData(m);
    return (d[TOTAL_KEY] || 0) / 10000;
  });

  if (miniChart) miniChart.destroy();
  const ctx = document.getElementById('mini-chart').getContext('2d');
  miniChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: values.map((_, i) => i === values.length - 1 ? TOTAL_COLOR : '#d1e5fa'),
        borderRadius: 4,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => `${ctx.parsed.y.toFixed(1)}만명` }
      }},
      scales: {
        x: { display: false },
        y: { display: false, beginAtZero: false }
      }
    }
  });
}

function renderTrendChart() {
  const labels = months.map(m => formatMonth(m, true));
  const datasets = [
    {
      label: '전체',
      data: months.map(m => (getMonthData(m)[TOTAL_KEY] || 0) / 10000),
      borderColor: TOTAL_COLOR,
      backgroundColor: 'transparent',
      borderWidth: 2.5,
      pointRadius: 3.5,
      pointBackgroundColor: TOTAL_COLOR,
      tension: 0.35,
    },
    ...SEGMENTS.map(seg => ({
      label: seg.label,
      data: months.map(m => (getMonthData(m)[seg.key] || 0) / 10000),
      borderColor: seg.color,
      backgroundColor: 'transparent',
      borderWidth: 1.5,
      pointRadius: 2.5,
      pointBackgroundColor: seg.color,
      tension: 0.35,
    }))
  ];

  if (trendChart) trendChart.destroy();
  const ctx = document.getElementById('trend-chart').getContext('2d');
  trendChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'bottom',
          labels: { font: { size: 11, family: '-apple-system' }, boxWidth: 12, padding: 16, usePointStyle: true }
        },
        tooltip: {
          backgroundColor: 'rgba(255,255,255,0.95)',
          titleColor: '#1d1d1f',
          bodyColor: '#6e6e73',
          borderColor: 'rgba(0,0,0,0.08)',
          borderWidth: 1,
          padding: 10,
          callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)}만명` }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { font: { size: 11 }, color: '#aeaeb2' }
        },
        y: {
          grid: { color: 'rgba(0,0,0,0.04)' },
          ticks: {
            font: { size: 11 }, color: '#aeaeb2',
            callback: v => v + '만'
          }
        }
      }
    }
  });
}

function renderRatioChart(thisData, totalUV) {
  const labels = SEGMENTS.map(s => s.label);
  const values = SEGMENTS.map(s => thisData[s.key] || 0);
  const colors = SEGMENTS.map(s => s.color);

  if (ratioChart) ratioChart.destroy();
  const ctx = document.getElementById('ratio-chart').getContext('2d');
  ratioChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: colors,
        borderWidth: 0,
        hoverOffset: 6,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '68%',
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            font: { size: 11, family: '-apple-system' },
            boxWidth: 10, padding: 12,
            usePointStyle: true,
            generateLabels: chart => {
              const d = chart.data;
              return d.labels.map((lbl, i) => {
                const val = d.datasets[0].data[i];
                const pct = totalUV > 0 ? ((val/totalUV)*100).toFixed(1) : '0';
                return {
                  text: `${lbl} ${pct}%`,
                  fillStyle: d.datasets[0].backgroundColor[i],
                  hidden: false,
                  index: i,
                };
              });
            }
          }
        },
        tooltip: {
          backgroundColor: 'rgba(255,255,255,0.95)',
          titleColor: '#1d1d1f',
          bodyColor: '#6e6e73',
          borderColor: 'rgba(0,0,0,0.08)',
          borderWidth: 1,
          callbacks: {
            label: ctx => {
              const val = ctx.parsed;
              const pct = totalUV > 0 ? ((val/totalUV)*100).toFixed(1) : '0';
              return ` ${fmt(val)}명 (${pct}%)`;
            }
          }
        }
      }
    }
  });
}

function renderMAUTable() {
  // 행 순서: 전체 MAU → 하위 고객군 (요청 순서)
  const TABLE_ROWS = [
    { key: TOTAL_KEY,         label: 'MAU',    isTotal: true },
    { key: '10_Btv연결',      label: '페어링', isTotal: false },
    { key: '09_T아이디연결',  label: 'T아이디',isTotal: false },
    { key: '02_월정액고객',   label: '월정액', isTotal: false },
    { key: '11_시청고객',     label: '시청',   isTotal: false },
    { key: '08_VOD구매',      label: '구매',   isTotal: false },
  ];

  // 헤더: 행 레이블 + 월 목록
  const thead = document.getElementById('table-head');
  thead.innerHTML = `<th>고객군</th>` +
    months.map(m => {
      const y = m.slice(0,4);
      const mo = parseInt(m.slice(4,6), 10);
      return `<th>${y.slice(2)}년 ${mo}월</th>`;
    }).join('');

  // 본문
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  TABLE_ROWS.forEach(row => {
    const tr = document.createElement('tr');
    tr.className = row.isTotal ? 'row-total' : 'row-seg';

    // 행 레이블
    let labelCell = `<td>${row.isTotal ? '' : '↳ '}${row.label}</td>`;

    // 월별 값 + MoM
    const cells = months.map((m, i) => {
      const cur  = (getMonthData(m)[row.key] || 0);
      const prev = i > 0 ? (getMonthData(months[i-1])[row.key] || 0) : null;

      const valStr = cur >= 10000
        ? (cur / 10000).toFixed(1) + '만'
        : cur.toLocaleString();

      let momStr = '';
      if (prev !== null && prev > 0) {
        const diff = cur - prev;
        const pct  = ((diff / prev) * 100).toFixed(1);
        if (diff > 0)      momStr = `<span class="cell-up">▲${pct}%</span>`;
        else if (diff < 0) momStr = `<span class="cell-down">▼${Math.abs(pct)}%</span>`;
        else               momStr = `<span class="cell-flat">—</span>`;
      }

      return `<td>${valStr}${momStr ? `<br><span style="font-size:10px;">${momStr}</span>` : ''}</td>`;
    }).join('');

    tr.innerHTML = labelCell + cells;
    tbody.appendChild(tr);
  });
}

// ══════════════════════════════════════════════
// 유틸
// ══════════════════════════════════════════════
function fmt(n) {
  return n >= 10000
    ? (n / 10000).toFixed(1) + '만'
    : n.toLocaleString();
}

function formatMonth(code, short = false) {
  const y = code.slice(0,4);
  const m = parseInt(code.slice(4,6), 10);
  return short ? `${m}월` : `${y}년 ${m}월`;
}

function momBadgeDark(cur, prev) {
  if (!prev) return '<span style="font-size:12px;color:rgba(255,255,255,0.5);">—</span>';
  const diff = cur - prev;
  const pct  = prev > 0 ? ((diff / prev) * 100).toFixed(1) : '0';
  const style = 'display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;margin-top:8px;';
  if (diff > 0) return `<span style="${style}background:rgba(255,255,255,0.2);color:#fff;">▲ ${pct}%</span>`;
  if (diff < 0) return `<span style="${style}background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.8);">▼ ${Math.abs(pct)}%</span>`;
  return `<span style="${style}background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);">— 0%</span>`;
}

function momBadge(cur, prev) {
  if (!prev) return '<span class="mom-badge flat">—</span>';
  const diff = cur - prev;
  const pct  = prev > 0 ? ((diff / prev) * 100).toFixed(1) : '0';
  if (diff > 0) return `<span class="mom-badge up">▲ ${pct}%</span>`;
  if (diff < 0) return `<span class="mom-badge down">▼ ${Math.abs(pct)}%</span>`;
  return '<span class="mom-badge flat">— 0%</span>';
}

function showBanner(msg, type) {
  const b = document.getElementById('status-banner');
  b.textContent = msg;
  b.style.display = 'flex';
  b.style.background = type === 'warn' ? '#fff8e7' : '#e8f1fb';
  b.style.borderColor = type === 'warn' ? '#f0c840' : '#90bff0';
  b.style.color       = type === 'warn' ? '#856404' : '#0c4a8f';
}

function navigate(page) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  // 추후 T아이디·페어링 탭 추가 시 여기서 전환
  if (page !== 'mau') {
    alert(`"${page}" 탭은 준비 중입니다.`);
  }
}

// ══════════════════════════════════════════════
// 시작
// ══════════════════════════════════════════════
loadData();
</script>
